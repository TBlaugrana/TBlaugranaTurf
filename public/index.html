<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>TBlaugranaTurf</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230b0f1a'/%3E%3Ctext y='50' x='5' font-size='50'%3E🐎%3C/text%3E%3C/svg%3E">
<style>
/* ── VARIABLES ─────────────────── */
:root {
  --bg:        #f0f4fb;
  --surface:   #ffffff;
  --surface2:  #f7f9fe;
  --surface3:  #eef2fa;
  --border:    #d0d9ef;
  --border2:   #b8c5e0;
  --accent:    #1a6fd4;
  --accent2:   #1558b0;
  --green:     #0d9e5c;
  --red:       #d93250;
  --yellow:    #c48a00;
  --text:      #1a2540;
  --text2:     #4a5f88;
  --text3:     #8899bb;
  --r:         6px;
  --font-mono: 'JetBrains Mono', monospace;
  --font-ui:   'Rajdhani', sans-serif;
}

/* ── RESET ─────────────────────── */
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { height:100%; overflow:hidden; overscroll-behavior:none; }
html { touch-action: manipulation; } /* supprime le délai de 300ms au tap sur iOS */
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-ui);
  font-size: 17px;
  display: flex;
  flex-direction: column;
  height: 100vh;
  height: 100dvh; /* iPhone : tient compte de la barre Safari qui se rétracte */
  padding-top: env(safe-area-inset-top);
  padding-bottom: env(safe-area-inset-bottom);
  padding-left: env(safe-area-inset-left);
  padding-right: env(safe-area-inset-right);
  -webkit-font-smoothing: antialiased;
  background-image:
    radial-gradient(ellipse at 50% 0%, rgba(26,111,212,.06) 0%, transparent 55%),
    radial-gradient(ellipse at 50% 100%, rgba(13,158,92,.04) 0%, transparent 50%);
}
::-webkit-scrollbar { width: 3px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }
button { touch-action: manipulation; } /* tap instantané, pas de double-tap zoom */

/* ── PETITS ÉCRANS (iPhone mini/SE et similaires < 380px) ── */
@media (max-width: 380px) {
  body { font-size: 16px; }
  .logo { font-size: 32px; letter-spacing: 3px; }
  .logo-horse { font-size: 30px; }
  #race-name { font-size: 18px; }
  #countdown { font-size: 46px; }
  .cd-mini { font-size: 30px; }
  .hname { font-size: 17px; }
  .cdirect { font-size: 21px; }
  .cdrop { font-size: 19px; }
  #th, .horse { grid-template-columns: 26px 1fr 48px 42px 78px; padding-left: 10px; padding-right: 10px; }
}

/* ── HEADER ──────────────────── */
#header {
  background: linear-gradient(180deg, #dae6f8 0%, #eef3fc 100%);
  border-bottom: 1px solid rgba(26,111,212,.2);
  padding: 16px 14px;
  display: flex;
  align-items: center;
  flex-shrink: 0;
  position: relative;
  gap: 8px;
  box-shadow: 0 2px 18px rgba(26,111,212,.12);
  touch-action: manipulation;
}
#header::after {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, transparent 0%, rgba(26,111,212,.4) 50%, transparent 100%);
}
.logo-wrap {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.logo-horse { font-size: 38px; line-height: 1; filter: drop-shadow(0 0 6px rgba(26,111,212,.4)); }
.logo {
  font-family: var(--font-ui);
  font-size: 40px;
  font-weight: 700;
  letter-spacing: 5px;
  background: linear-gradient(135deg, #1a6fd4 0%, #0d9e5c 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  filter: drop-shadow(0 0 6px rgba(26,111,212,.15));
}
#status-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--green);
  box-shadow: 0 0 8px var(--green), 0 0 16px rgba(31,212,126,.3);
  animation: pulse 2.5s infinite;
  flex-shrink: 0;
}
#status-dot.err { background:var(--red); box-shadow:0 0 6px var(--red); animation:none; }

/* ── PROGRESS BAR ──────────────── */
#prog-bar { height: 2px; background: rgba(255,255,255,.03); flex-shrink:0; }
#prog-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--green));
  transition: width .8s linear;
  width: 0%;
  box-shadow: 0 0 6px rgba(61,142,240,.6);
}

/* ── RACE BAR ──────────────────── */
#race-bar {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 10px 12px;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
  box-shadow: 0 1px 6px rgba(26,111,212,.06);
}
.nav-btn {
  background: rgba(61,142,240,.1);
  border: 1px solid rgba(61,142,240,.2);
  color: var(--text2);
  font-size: 22px;
  width: 34px; height: 34px;
  border-radius: var(--r);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all .15s;
  flex-shrink: 0;
  line-height: 1;
}
.nav-btn:hover { background:var(--accent); border-color:var(--accent); color:#fff; box-shadow:0 0 12px rgba(61,142,240,.4); }
.nav-btn:active { transform:scale(.92); }
.nav-btn:disabled { opacity:.2; cursor:not-allowed; pointer-events:none; }
.nav-btn { touch-action: manipulation; }

#race-info { flex:1; min-width:0; }
#race-code {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--accent2);
  letter-spacing: 2px;
  margin-bottom: 1px;
}
#race-name {
  font-size: 21px;
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  letter-spacing: .3px;
  line-height: 1.2;
}
#race-sub {
  font-size: 15px;
  color: var(--text3);
  margin-top: 1px;
  letter-spacing: .3px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
#race-counter {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--text3);
  margin-top: 1px;
}

#cd-wrap { flex-shrink:0; text-align:right; }
#cd-label {
  font-size: 13px;
  color: var(--text3);
  letter-spacing: 2px;
  margin-bottom: 2px;
  text-transform: uppercase;
  font-family: var(--font-mono);
}
#countdown {
  font-family: var(--font-mono);
  font-size: 56px;
  font-weight: 700;
  color: var(--green);
  line-height: 1;
  letter-spacing: -1px;
  text-shadow: 0 0 10px rgba(13,158,92,.2);
}
#countdown.warn { color:var(--yellow); text-shadow:0 0 12px rgba(245,192,64,.3); }
#countdown.crit { color:var(--red); animation:blink .45s infinite; text-shadow:0 0 12px rgba(240,68,85,.4); }
#snap-badge {
  display: none;
  background: rgba(245,192,64,.1);
  border: 1px solid rgba(245,192,64,.4);
  color: var(--yellow);
  font-size: 11px;
  font-family: var(--font-mono);
  padding: 2px 6px;
  border-radius: 3px;
  letter-spacing: 1px;
  margin-top: 3px;
  text-align: center;
  animation: glow 2s infinite;
}

/* ── FILTER BAR ─────────────────── */
#filter-bar {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 8px 12px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  flex-shrink: 0;
}
#filter-row1 {
  display: flex;
  align-items: center;
  gap: 6px;
}
#filter-row2 {
  display: flex;
  align-items: center;
  gap: 5px;
}
.flabel {
  font-size: 12px;
  color: var(--text3);
  letter-spacing: 1px;
  white-space: nowrap;
  font-family: var(--font-mono);
  text-transform: uppercase;
}
#max-cote {
  background: rgba(61,142,240,.08);
  border: 1px solid rgba(61,142,240,.22);
  color: var(--accent2);
  font-family: var(--font-mono);
  font-size: 17px;
  padding: 4px 6px;
  width: 58px;
  border-radius: var(--r);
  outline: none;
  transition: all .15s;
}
#max-cote:focus { border-color:var(--accent); box-shadow:0 0 0 2px rgba(61,142,240,.12); }
#drop-pct-input {
  background: rgba(31,212,126,.08);
  border: 1px solid rgba(31,212,126,.22);
  color: var(--green);
  font-family: var(--font-mono);
  font-size: 17px;
  padding: 4px 6px;
  width: 54px;
  border-radius: var(--r);
  outline: none;
  transition: all .15s;
}
#drop-pct-input:focus { border-color:var(--green); box-shadow:0 0 0 2px rgba(31,212,126,.12); }
.vsep { width:1px; height:16px; background:var(--border); flex-shrink:0; }
#ts {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--text3);
  white-space: nowrap;
  flex-shrink: 0;
}
#audio-btn, #tg-btn {
  flex: 1;
  background: none;
  border: 1px solid var(--border2);
  color: var(--text2);
  font-family: var(--font-ui);
  font-size: 16px;
  font-weight: 700;
  letter-spacing: .5px;
  padding: 6px 0;
  border-radius: var(--r);
  cursor: pointer;
  transition: all .15s;
  text-align: center;
  white-space: nowrap;
}
#audio-btn.on { color:var(--green); border-color:rgba(31,212,126,.4); background:rgba(31,212,126,.07); }
#tg-btn.on    { color:#4fbde8; border-color:rgba(79,189,232,.4); background:rgba(79,189,232,.07); }
#tg-test-btn {
  background: none;
  border: 1px solid var(--border2);
  color: var(--text3);
  font-size: 17px;
  padding: 5px 9px;
  border-radius: var(--r);
  cursor: pointer;
  transition: all .15s;
  flex-shrink: 0;
}
#tg-test-btn:hover { border-color:rgba(79,189,232,.5); color:#4fbde8; }

/* ── FOOTER BAR (statut de rafraîchissement) ── */
#footer-bar {
  background: var(--surface2);
  border-top: 1px solid var(--border);
  padding: 5px 12px calc(5px + env(safe-area-inset-bottom));
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

/* ── TABLE HEADER ───────────────── */
#th {
  background: var(--surface2);
  border-bottom: 1px solid var(--border2);
  padding: 9px 14px;
  display: grid;
  grid-template-columns: 32px 1fr 58px 48px 92px;
  gap: 4px;
  font-size: 13px;
  letter-spacing: 1.5px;
  color: var(--text3);
  text-transform: uppercase;
  font-weight: 700;
  font-family: var(--font-mono);
  flex-shrink: 0;
}

/* ── PARTICIPANTS ───────────────── */
#participants {
  flex: 1;
  overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
}
.horse {
  display: grid;
  grid-template-columns: 32px 1fr 58px 48px 92px;
  gap: 4px;
  align-items: center;
  padding: 14px 14px;
  border-bottom: 1px solid rgba(30,37,64,.9);
  transition: background .12s;
  position: relative;
}
.horse::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0; width: 0;
  background: var(--accent);
  transition: width .15s;
}
.horse:hover { background: rgba(61,142,240,.05); }
.horse:hover::before { width: 2px; }
.horse.np { opacity:.22; text-decoration:line-through; }
.horse.fav .hname { font-weight: 700; }

.hnum {
  font-family: var(--font-mono);
  font-size: 17px;
  color: var(--text3);
  text-align: center;
  font-weight: 700;
  background: rgba(255,255,255,.04);
  border-radius: 3px;
  padding: 3px 0;
  line-height: 1.4;
}
.hname {
  font-size: 20px;
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  letter-spacing: .2px;
  line-height: 1.3;
  min-width: 0;
}
.cdirect {
  font-family: var(--font-mono);
  font-size: 25px;
  font-weight: 700;
  text-align: center;
  letter-spacing: -0.5px;
}
.csnap {
  font-family: var(--font-mono);
  font-size: 17px;
  text-align: center;
  color: var(--text3);
}
.cdrop {
  font-family: var(--font-mono);
  font-size: 23px;
  text-align: center;
  font-weight: 700;
  letter-spacing: -0.5px;
  padding: 4px 2px;
  border-radius: 5px;
  box-sizing: border-box;
}
.cdrop.hot  { color:var(--green); background:rgba(31,212,126,.14); box-shadow:0 0 10px rgba(31,212,126,.25); text-shadow:0 0 8px rgba(31,212,126,.4); }
.cdrop.warm { color:var(--yellow); background:rgba(245,192,64,.14); }
.cdrop.low  { color:var(--text2); background:rgba(255,255,255,.04); }
.cdrop.up   { color:var(--red); background:rgba(240,68,85,.12); font-size: 23px; }
.horse.alerted { background:rgba(31,212,126,.05); }
.horse.alerted::before { width:3px; background:var(--green); }

/* ── ALERTS — masqué ──────────────────────── */
#alerts { display: none !important; }

/* ── LOADING ─────────────────────── */
#loading {
  position: fixed; inset: 0;
  background: var(--bg);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 200;
  gap: 14px;
  background-image: radial-gradient(ellipse at 50% 40%, rgba(26,111,212,.08) 0%, transparent 60%);
}
.spinner {
  width: 34px; height: 34px;
  border: 2px solid var(--border2);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin .7s linear infinite;
}
.ltxt {
  font-family: var(--font-ui);
  font-size: 24px;
  font-weight: 700;
  letter-spacing: 5px;
  background: linear-gradient(135deg, #1a6fd4, #0d9e5c);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.lsub { font-family:var(--font-mono); font-size: 11px; color:var(--text3); letter-spacing:2px; text-transform:uppercase; }

/* ── ANIMATIONS ──────────────────── */
@keyframes pulse   { 0%,100%{ opacity:1; transform:scale(1) } 50%{ opacity:.3; transform:scale(.8) } }
@keyframes blink   { 0%,100%{ opacity:1 } 50%{ opacity:.1 } }
@keyframes spin    { to{ transform:rotate(360deg) } }
@keyframes slideIn { from{ transform:translateX(-5px);opacity:0 } to{ transform:translateX(0);opacity:1 } }
@keyframes rowFlash{ 0%{ background:rgba(31,212,126,.22) } 100%{ background:transparent } }
@keyframes glow    { 0%,100%{ box-shadow:0 0 4px rgba(245,192,64,.2) } 50%{ box-shadow:0 0 10px rgba(245,192,64,.5) } }
.flash { animation: rowFlash 1s ease forwards; }

input[type=number]::-webkit-inner-spin-button,
input[type=number]::-webkit-outer-spin-button { opacity:.3; }

/* ── COUNTDOWN MINI (filter bar) ── */
#cd-wrap-mini {
  display: flex;
  align-items: center;
  margin-left: 8px;
}
.cd-mini {
  font-family: var(--font-mono);
  font-size: 36px;
  font-weight: 700;
  color: var(--green);
  letter-spacing: -1px;
  line-height: 1;
  text-shadow: 0 0 10px rgba(31,212,126,.3);
}
.cd-mini.warn { color: var(--yellow); text-shadow: 0 0 10px rgba(245,192,64,.3); }
.cd-mini.crit { color: var(--red); animation: blink .45s infinite; text-shadow: 0 0 10px rgba(240,68,85,.4); }
.cd-mini.elapsed { color: var(--text2); text-shadow: none; font-size: 22px; }

/* ── SETTINGS OVERLAY ───────────── */
#settings-overlay {
  position: fixed; inset: 0;
  background: rgba(5,7,14,.78);
  backdrop-filter: blur(3px);
  display: flex;
  align-items: flex-end;
  justify-content: center;
  z-index: 300;
  opacity: 0;
  pointer-events: none;
  transition: opacity .18s;
}
#settings-overlay.show { opacity: 1; pointer-events: auto; }
#settings-panel {
  background: var(--surface);
  border: 1px solid var(--border2);
  border-bottom: none;
  border-radius: 14px 14px 0 0;
  width: 100%;
  max-width: 460px;
  max-height: 86vh;
  display: flex;
  flex-direction: column;
  box-shadow: 0 -8px 40px rgba(0,0,0,.6);
  transform: translateY(14px);
  transition: transform .18s;
}
#settings-overlay.show #settings-panel { transform: translateY(0); }
#settings-hd {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 16px;
  border-bottom: 1px solid var(--border);
  font-family: var(--font-ui);
  font-weight: 700;
  font-size: 18px;
  letter-spacing: .5px;
  flex-shrink: 0;
}
#settings-close {
  background: none;
  border: none;
  color: var(--text2);
  font-size: 20px;
  cursor: pointer;
  line-height: 1;
  padding: 2px 6px;
}
#settings-close:hover { color:var(--text); }
#settings-body { overflow-y: auto; padding: 14px 16px 4px; flex: 1; }
.settings-section { margin-bottom: 20px; }
.settings-section-title {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 2px;
  color: var(--accent2);
  text-transform: uppercase;
  margin-bottom: 12px;
  padding-bottom: 6px;
  border-bottom: 1px solid var(--border);
}
.settings-field { display:flex; flex-direction:column; gap:5px; margin-bottom:12px; }
.settings-field label { font-size:13px; color:var(--text2); letter-spacing:.3px; line-height:1.4; }
.settings-field .hint { color:var(--text3); font-size:11px; font-weight:400; }
.settings-field input[type=text],
.settings-field input[type=number] {
  background: var(--surface3);
  border: 1px solid var(--border2);
  color: var(--text);
  font-family: var(--font-mono);
  font-size: 16px; /* >=16px : évite le zoom auto au focus sur iOS Safari */
  padding: 9px 10px;
  border-radius: var(--r);
  outline: none;
  transition: border-color .15s;
}
.settings-field input:focus { border-color: var(--accent); box-shadow:0 0 0 2px rgba(61,142,240,.12); }
.settings-toggle {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}
.settings-toggle span { font-size:14px; color:var(--text); }
.switch { position:relative; width:42px; height:24px; flex-shrink:0; display:inline-block; }
.switch input { opacity:0; width:0; height:0; }
.switch .slider {
  position:absolute; inset:0;
  background:var(--border2);
  border-radius:24px;
  cursor:pointer;
  transition:.2s;
}
.switch .slider::before {
  content:'';
  position:absolute;
  width:18px; height:18px;
  left:3px; top:3px;
  background:#fff;
  border-radius:50%;
  transition:.2s;
}
.switch input:checked + .slider { background: var(--green); }
.switch input:checked + .slider::before { transform: translateX(18px); }
#settings-test-btn {
  width: 100%;
  background: rgba(79,189,232,.08);
  border: 1px solid rgba(79,189,232,.3);
  color: #4fbde8;
  font-family: var(--font-ui);
  font-weight: 700;
  font-size: 14px;
  padding: 9px 0;
  border-radius: var(--r);
  cursor: pointer;
  margin-top: 2px;
  transition: all .15s;
}
#settings-test-btn:hover { background:rgba(79,189,232,.16); }
#settings-footer {
  display: flex;
  gap: 10px;
  padding: 12px 16px calc(16px + env(safe-area-inset-bottom));
  border-top: 1px solid var(--border);
  flex-shrink: 0;
}
#settings-reset, #settings-save {
  flex: 1;
  padding: 11px 0;
  border-radius: var(--r);
  cursor: pointer;
  font-family: var(--font-ui);
  font-weight: 700;
  font-size: 15px;
  letter-spacing: .3px;
  transition: all .15s;
}
#settings-reset { background:none; border:1px solid var(--border2); color:var(--text2); }
#settings-reset:hover { border-color:var(--red); color:var(--red); }
#settings-save { background: linear-gradient(135deg, var(--accent), var(--green)); border:none; color:#fff; }
#settings-save:hover { filter:brightness(1.1); box-shadow:0 0 14px rgba(61,142,240,.4); }
</style>
</head>
<body>

<!-- LOADING SCREEN -->
<div id="loading">
  <div class="spinner"></div>
  <span class="ltxt">TBlaugranaTurf</span>
  <span id="load-sub" class="lsub">CHARGEMENT DU PROGRAMME...</span>
</div>

<!-- HEADER -->
<div id="header">
  <div class="logo-wrap">
    <span class="logo-horse">🐎</span>
    <span class="logo">TBlaugranaTurf</span>

<script>
window.addEventListener('error', function (e) {

});
window.addEventListener('unhandledrejection', function (e) {
  try {
    var sub = document.getElementById('load-sub');
    var loading = document.getElementById('loading');
    if (loading) loading.style.display = 'flex';

      sub.style.color = '#d93250';
      sub.style.wordBreak = 'break-word';
      sub.style.maxWidth = '90vw';
      sub.textContent = 'PROMESSE REJETÉE : ' + (e.reason && e.reason.message ? e.reason.message : e.reason);
    }

});
'use strict';
// ═══════════════════════════════════════════════════════
//  TBlaugranaTurf — FRONT DE CONSULTATION UNIQUEMENT
//  Le moteur (snapshot, gel des cotes, chutes, Telegram)
//  tourne exclusivement côté SERVEUR (server.js, Railway),
//  en continu, même si aucun visiteur n'est connecté.
//  Cette page ne fait plus AUCUN calcul ni AUCUNE requête
//  vers l'API PMU : elle se contente d'interroger /api/state
//  chaque seconde et d'afficher ce que le serveur renvoie.
//  → Fermer cette page, éteindre le téléphone, etc. n'a
//    plus AUCUN impact sur le bot : il continue de tourner
//    sur Railway et d'envoyer les alertes Telegram.
// ═══════════════════════════════════════════════════════

const STATE_URL   = '/api/state';
const POLL_MS      = 1000;   // lecture de l'état serveur (léger : juste de la mémoire côté serveur)
const PROG_STALE_MS = 5 * 60 * 1000; // au-delà, on considère l'état "perdu la connexion"

const CFG = {
  fetchTimeoutMs: 4000,
  maxAlerts:      3,
};

// ── ÉTAT GLOBAL (miroir de /api/state, rien n'est calculé localement) ──
let S = {
  today:        '',
  programme:    [],   // métadonnées de toutes les courses du jour (vient du serveur)
  curRaceIdx:   -1,   // course actuellement suivie EN DIRECT par le bot serveur
  manualIdx:    -1,   // -1 = on suit automatiquement la course du bot ; sinon on "consulte" une autre course de la liste (infos seulement, pas de cotes live)
  race:         null,
  participants: [],
  snapCotes:    {},
  snapDone:     false,
  oddsFrozenAt: null,
  alertedDrop:  new Set(),
  alertCount:   0,
  audioOn:      true,
  hideRising:      false,
  hideNonPartants: true,
  tick:         0,
  lastStateOk:  0,
};

// ── UTILS TEMPS ─────────────────────────────────────────
function timeNow() {
  const d = new Date();
  return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`;
}
function fmtCd(s) {
  const neg = s < 0;
  const a = Math.abs(s);
  const h = Math.floor(a / 3600), m = Math.floor((a % 3600) / 60), sec = a % 60;
  const str = h > 0
    ? `${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`
    : `${m}:${String(sec).padStart(2,'0')}`;
  return neg ? `+${str}` : str;
}

function getMaxCote()  { const v = parseFloat(document.getElementById('max-cote').value);       return isNaN(v) ? 9999 : v; }
function getDropPct()  { const v = parseFloat(document.getElementById('drop-pct-input').value); return isNaN(v) ? 25   : v; }

const HORSE_NAME_MAX_LEN = 12;
function truncName(nom) {
  if (!nom) return '';
  return nom.length > HORSE_NAME_MAX_LEN ? nom.slice(0, HORSE_NAME_MAX_LEN - 1) + '…' : nom;
}

// ── SON ─────────────────────────────────────────────────
let _ac = null;
function getAC() {
  if (!_ac) _ac = new (window.AudioContext || window.webkitAudioContext)();
  return _ac;
}
document.addEventListener('click', () => { try { getAC(); } catch (_) {} }, { once: true });

function beep(freq = 880, dur = 150, type = 'sine') {
  if (!S.audioOn) return;
  try {
    const ac = getAC();
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.15, ac.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur / 1000);
    osc.connect(gain).connect(ac.destination);
    osc.start();
    osc.stop(ac.currentTime + dur / 1000);
  } catch (_) {}
}
function alertBeep() { beep(1046, 180, 'square'); setTimeout(() => beep(1318, 180, 'square'), 140); }
function snapBeep()  { beep(660, 120, 'sine'); }

// ── FETCH AVEC TIMEOUT ───────────────────────────────────
async function fetchWithTimeout(url, opts = {}, ms = CFG.fetchTimeoutMs) {
  const ctrl = new AbortController();
  const id = setTimeout(() => ctrl.abort(), ms);
  try {
    const r = await fetch(url, { ...opts, signal: ctrl.signal });
    clearTimeout(id);
    return r;
  } catch (e) {
    clearTimeout(id);
    throw e;
  }
}

// ── NAVIGATION (consultation seule — ne touche jamais au bot) ──
function effectiveIdx() {
  if (S.manualIdx >= 0 && S.manualIdx < S.programme.length) return S.manualIdx;
  return S.curRaceIdx;
}
function isLiveRace(idx) { return idx === S.curRaceIdx; }

function updateNav() {
  const idx = effectiveIdx();
  const len = S.programme.length;
  document.getElementById('btn-prev').disabled = idx <= 0;
  document.getElementById('btn-next').disabled = idx >= len - 1;
}

document.getElementById('btn-prev').onclick = () => {
  const i = effectiveIdx();
  if (i > 0) { S.manualIdx = i - 1; renderRaceView(); updateNav(); }
};
document.getElementById('btn-next').onclick = () => {
  const i = effectiveIdx();
  if (i < S.programme.length - 1) { S.manualIdx = i + 1; renderRaceView(); updateNav(); }
};
document.getElementById('audio-btn').onclick = () => {
  S.audioOn = !S.audioOn;
  const btn = document.getElementById('audio-btn');
  btn.className = S.audioOn ? 'on' : '';
  btn.textContent = S.audioOn ? '🔔 SON' : '🔕 SON OFF';
  if (S.audioOn) beep(880, 120);
};
// Les notifications Telegram sont envoyées uniquement par le serveur
// (server.js), en continu, qu'un visiteur soit connecté ou non.
// Ce bouton n'a donc plus d'action à faire ici — il est conservé
// uniquement comme rappel visuel de l'état (toujours actif côté bot).
const tgBtn = document.getElementById('tg-btn');
if (tgBtn) {
  tgBtn.title = 'Géré côté serveur — toujours actif';
  tgBtn.onclick = () => {
    addAlert('info', 'ℹ️', 'Telegram est géré par le bot serveur (Railway), toujours actif — rien à activer ici.');
  };
}
document.getElementById('tg-test-btn').onclick = async () => {
  addAlert('info', '🧪', 'Test Telegram en cours...');
  const apiBase = `https://api.telegram.org/bot${'8961502220:AAGlpLomYVMXRQgrJsPp5M4m-omFPJPBKoU'}/sendMessage`;
  const chatIds = ['625118343', '8288460384'];
  const text = `🧪 *Test TBlaugranaTurf*\nConnexion Telegram OK ✅\n${new Date().toLocaleTimeString('fr-FR')}`;
  for (const chatId of chatIds) {
    try {
      const r    = await fetch(apiBase, {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ chat_id: chatId, text, parse_mode: 'Markdown' }),
      });
      const json = await r.json();
      if (r.ok && json.ok) {
        addAlert('info', '✅', `Test OK → chat ${chatId}`);
      } else {
        addAlert('info', '❌', `Test ÉCHEC chat ${chatId} : ${json.description || r.status}`);
      }
    } catch (e) {
      addAlert('info', '❌', `Test EXCEPTION chat ${chatId} : ${e.message}`);
    }
  }
};

// ── RENDU TABLE (mise à jour différentielle) ────────────
function renderTable() {
  const maxCote  = getMaxCote();
  const minPct   = getDropPct();
  const container = document.getElementById('participants');

  const getDrop = p => {
    const snap = S.snapCotes[p.numPmu];
    const cd   = p.dernierRapportDirect?.rapport ?? p.cote;
    return (snap != null && cd != null) ? (snap - cd) / snap * 100 : -9999;
  };

  const sorted = [...S.participants].sort((a, b) => {
    const da = getDrop(a), db = getDrop(b);
    if (da !== -9999 && db !== -9999) return db - da;
    if (da !== -9999) return -1;
    if (db !== -9999) return 1;
    const ca = a.dernierRapportDirect?.rapport ?? a.cote ?? 9999;
    const cb = b.dernierRapportDirect?.rapport ?? b.cote ?? 9999;
    return ca - cb;
  });

  const visible = sorted.filter(p => {
    if (S.hideNonPartants && p.statut === 'NON_PARTANT') return false;
    const cote = p.dernierRapportDirect?.rapport ?? p.cote ?? 9999;
    if (cote > maxCote) return false;
    if (S.hideRising) {
      const snap = S.snapCotes[p.numPmu];
      const cd   = p.dernierRapportDirect?.rapport ?? p.cote;
      if (snap != null && cd != null && cd > snap) return false;
    }
    return true;
  });
  const visIds  = new Set(visible.map(p => `row-${p.numPmu}`));

  for (const row of [...container.children]) {
    if (!visIds.has(row.id)) row.remove();
  }

  for (let i = 0; i < visible.length; i++) {
    const p   = visible[i];
    const np  = p.statut === 'NON_PARTANT';
    const fav = p.dernierRapportDirect?.favoris;
    const cd  = p.dernierRapportDirect?.rapport ?? p.cote ?? '—';
    const snap = S.snapCotes[p.numPmu];
    const cs  = snap ?? '—';

    let dropTxt = '', dropClass = '';
    if (snap != null && cd !== '—') {
      const dr = (snap - cd) / snap * 100;
      if (dr > 0) {
        dropTxt = `−${dr.toFixed(1)}%`;
        if      (dr >= minPct) { dropClass = 'hot'; }
        else if (dr >= 10)     { dropClass = 'warm'; }
        else                   { dropClass = 'low'; }
      } else if (dr < 0) {
        dropTxt = `+${Math.abs(dr).toFixed(1)}%`;
        dropClass = 'up';
      } else {
        dropTxt = '0%';
      }
    }

    let row = document.getElementById(`row-${p.numPmu}`);
    if (!row) {
      row = document.createElement('div');
      row.id = `row-${p.numPmu}`;
      row.className = `horse${np ? ' np' : ''}${fav ? ' fav' : ''}`;
      row.innerHTML =
        `<span class="hnum">${p.numPmu}</span>` +
        `<div><div class="hname" title="${p.nom}">${truncName(p.nom)}</div></div>` +
        `<span class="csnap">${cs}</span>` +
        `<span class="cdirect">${cd}</span>` +
        `<span class="cdrop ${dropClass}">${dropTxt || '—'}</span>`;
      container.appendChild(row);
    } else {
      const cells   = row.children;
      const celSnap = cells[2];
      const celCD   = cells[3];
      const celDrop = cells[4];

      const cdStr = String(cd);
      if (celCD.textContent !== cdStr) celCD.textContent = cdStr;

      const csStr = String(cs);
      if (celSnap.textContent !== csStr) celSnap.textContent = csStr;

      const dt = dropTxt || '—';
      if (celDrop.textContent !== dt) celDrop.textContent = dt;
      const dc = `cdrop ${dropClass}`;
      if (celDrop.className !== dc) celDrop.className = dc;
    }

    row.classList.toggle('alerted', S.alertedDrop.has(p.numPmu));

    if (container.children[i] !== row) container.insertBefore(row, container.children[i] || null);
  }
}

// ── ALERTES ─────────────────────────────────────────────
function addAlert(type, icon, msg) {
  const list = document.getElementById('alerts-list');
  const item = document.createElement('div');
  item.className = `aitem ${type}`;
  item.innerHTML = `<span class="atime">${timeNow()}</span><span class="aicon">${icon}</span><span class="amsg">${msg}</span>`;
  list.prepend(item);
  while (list.children.length > CFG.maxAlerts) list.removeChild(list.lastChild);
  if (type !== 'info' && type !== 'prog') {
    S.alertCount++;
    const badge = document.getElementById('abadge');
    badge.textContent = S.alertCount;
    badge.style.display = 'inline';
  }
}
function clearAlerts() {
  document.getElementById('alerts-list').innerHTML = '';
  S.alertCount = 0;
  document.getElementById('abadge').style.display = 'none';
}

// ── STATUS DOT ──────────────────────────────────────────
function setStatus(ok) {
  document.getElementById('status-dot').className = ok ? '' : 'err';
}
function setLoadSub(t) {
  const e = document.getElementById('load-sub');
  if (e) e.textContent = t;
}

// ── RENDU DE LA VUE COURSE (à partir du miroir S, jamais de calcul) ──
function renderRaceView() {
  if (S.programme.length === 0) return;
  const idx  = effectiveIdx();
  const meta = S.programme[idx];
  if (!meta) return;
  const live = isLiveRace(idx);

  document.getElementById('race-code').textContent    = `R${meta.reunion} · C${meta.course}`;
  document.getElementById('race-name').textContent    = `${meta.hip ? meta.hip + ' — ' : ''}${meta.libelle}`;
  document.getElementById('race-sub').textContent     = meta.disc + (live ? '' : '  ·  consultation (pas la course suivie en direct)');
  document.getElementById('race-counter').textContent = `${idx + 1} / ${S.programme.length}`;

  const secsLeft = Math.round((meta.depart - Date.now()) / 1000);
  const cd = document.getElementById('countdown');
  cd.textContent = fmtCd(secsLeft);
  cd.className = secsLeft < 0 ? '' : secsLeft <= 30 ? 'crit' : secsLeft <= 120 ? 'warn' : '';

  const cdMini = document.getElementById('countdown-mini');
  const cdLabel = document.getElementById('cd-label-mini');
  if (cdMini) {
    cdMini.textContent = fmtCd(secsLeft);
    cdMini.className = 'cd-mini' + (secsLeft < 0 ? ' elapsed' : secsLeft <= 30 ? ' crit' : secsLeft <= 120 ? ' warn' : '');
  }
  if (cdLabel) cdLabel.textContent = secsLeft < 0 ? 'PARTI DEPUIS' : 'DÉPART DANS';

  const snapMini = document.getElementById('snap-badge-mini');
  if (snapMini) snapMini.style.display = (live && S.snapDone) ? 'inline' : 'none';
  const frozenMini = document.getElementById('frozen-badge-mini');
  if (frozenMini) frozenMini.style.display = (live && S.oddsFrozenAt !== null) ? 'inline' : 'none';
  document.getElementById('snap-badge').style.display = (live && S.snapDone) ? 'block' : 'none';

  const pct = Math.max(0, Math.min(100, (1 - Math.max(0, secsLeft) / 3600) * 100));
  document.getElementById('prog-fill').style.width = live ? pct + '%' : '0%';

  if (live) {
    renderTable();
  } else {
    // Course consultée mais pas suivie en direct par le bot : pas de
    // cotes à afficher (le serveur ne suit qu'une course à la fois).
    document.getElementById('participants').innerHTML =
      '<div style="padding:24px 12px;text-align:center;color:var(--text3);font-size:13px">Le bot suit une autre course en ce moment.<br>Utilisez ◀ ▶ pour revenir à la course en direct.</div>';
  }
}

// ── SYNCHRO ÉTAT SERVEUR (seule source de vérité) ────────
async function syncState() {
  let data;
  try {
    const r = await fetchWithTimeout(STATE_URL, { cache: 'no-store' });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    data = await r.json();
    if (!data.ok) throw new Error('état serveur invalide');
  } catch (e) {
    setStatus(false);
    document.getElementById('ts').innerHTML =
      `⚠ ${timeNow()} <span style="color:var(--red)">${e.message}</span>`;
    return;
  }

  setStatus(true);
  S.lastStateOk = Date.now();
  document.getElementById('ts').innerHTML = `↻ ${timeNow()} <span style="color:#29c98a;font-weight:600">serveur OK</span>`;

  const firstLoad = S.programme.length === 0 && data.programme.length > 0;
  S.today      = data.today;
  S.programme  = data.programme || [];

  const raceChanged = data.curRaceIdx !== S.curRaceIdx;
  S.curRaceIdx = data.curRaceIdx;

  if (firstLoad) {
    addAlert('prog', '📋', `Programme : ${S.programme.length} course(s) FR aujourd'hui`);
  }
  if (raceChanged && S.curRaceIdx >= 0) {
    // Nouvelle course suivie par le bot serveur → on réaligne l'affichage
    // (sauf si l'utilisateur consulte volontairement une autre course).
    S.snapCotes = {};
    S.alertedDrop = new Set();
    S.snapDone = false;
    S.oddsFrozenAt = null;
    if (S.manualIdx === -1) {
      document.getElementById('participants').innerHTML = '';
    }
  }

  // On adopte l'état LIVE du bot (participants, snapshot, gel, alertes)
  // uniquement quand on affiche effectivement la course suivie.
  S.participants = data.participants || [];
  for (const p of S.participants) {
    if (p.snap != null) S.snapCotes[p.numPmu] = p.snap;
  }

  // Détection de nouveaux événements côté serveur → alerte locale + son
  // (le serveur a DÉJÀ envoyé Telegram ; ceci ne fait qu'informer l'écran).
  if (data.snapDone && !S.snapDone) {
    S.snapDone = true;
    addAlert('snap', '📸', `SNAPSHOT — ${S.participants.filter(p => p.snap != null).length} chevaux`);
    snapBeep();
  }
  if (data.oddsFrozenAt !== null && S.oddsFrozenAt === null) {
    S.oddsFrozenAt = data.oddsFrozenAt;
    addAlert('info', '🧊', 'Cotes figées');
  }
  for (const p of S.participants) {
    if (p.alerted && !S.alertedDrop.has(p.numPmu)) {
      S.alertedDrop.add(p.numPmu);
      if (p.snap != null && p.cote != null) {
        const drop = (p.snap - p.cote) / p.snap * 100;
        addAlert('drop', '🔥', `${p.nom} — ${p.snap} → ${p.cote} (−${drop.toFixed(0)}%)`);
        alertBeep();
        const row = document.getElementById(`row-${p.numPmu}`);
        if (row) { row.classList.add('flash'); setTimeout(() => row.classList.remove('flash'), 900); }
      }
    }
  }

  if (S.manualIdx >= 0 && S.programme.length && S.manualIdx >= S.programme.length) {
    S.manualIdx = -1; // la liste a changé de taille, on revient au direct
  }

  updateNav();
  renderRaceView();
}

// ── BOUCLE PRINCIPALE (lecture seule, 1×/s) ─────────────
async function tick() {
  S.tick++;
  await syncState();
}

async function boot() {
  document.getElementById('loading').style.display = 'flex';
  setLoadSub('CONNEXION AU SERVEUR...');
  await syncState();
  document.getElementById('loading').style.display = 'none';
  setInterval(tick, POLL_MS);
}

const _bootWatchdog = setTimeout(function () {
  const sub = document.getElementById('load-sub');
  if (sub && sub.textContent.indexOf('CONNEXION') !== -1) {
    sub.style.color = '#d93250';
    sub.textContent = 'BLOQUÉ : /api/state ne répond pas après 8s (le serveur Railway est-il bien démarré ?)';
  }
}, 8000);

boot().catch(function (e) {
  const sub = document.getElementById('load-sub');
  if (sub) {
    sub.style.color = '#d93250';
    sub.style.wordBreak = 'break-word';
    sub.style.maxWidth = '90vw';
    sub.textContent = 'ERREUR DANS boot() : ' + (e && e.message ? e.message : e);
  }
}).finally(function () {
  clearTimeout(_bootWatchdog);
});
</script>
