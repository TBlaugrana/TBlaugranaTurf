<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TBlaugrana Rang</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f3efe3;
    --surface:#fffdf8;
    --surface-alt:#ece4d0;
    --border:#ddd3b8;
    --text:#1f2a22;
    --text-dim:#7d7460;
    --accent:#1f3d2c;
    --accent-2:#8b5e34;
    --success:#2f7a4f;
    --success-bg:#e4efe6;
    --danger:#b23a2e;
    --danger-bg:#f6e6e2;
    --tote-bg:#14201a;
    --tote-fg:#e8b24d;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
  }
  .page{
    max-width:600px;
    margin:0 auto;
    min-height:100vh;
    padding:8px 18px 14px;
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .eyebrow{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--accent-2);
    font-weight:500;
  }
  h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:30px;
    line-height:1.05;
    margin:4px 0 2px;
    color:var(--accent);
  }
  .subtitle{
    font-size:13px;
    color:var(--text-dim);
  }
  .subtitle b{ color:var(--text); font-weight:600; }

  .brand-title{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:32px;
    line-height:1;
    color:var(--accent);
    text-align:center;
    letter-spacing:.015em;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    margin:14px 0 22px;
  }

  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:16px 18px;
  }

  .btn-row-compact button{
    font-size:13px;
    padding:9px 10px;
  }

  .field{ margin-bottom:12px; }
  .field:last-child{ margin-bottom:0; }
  label{
    display:block;
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:.08em;
    color:var(--text-dim);
    margin-bottom:5px;
    font-weight:600;
  }
  select{
    width:100%;
    appearance:none;
    -webkit-appearance:none;
    background:var(--surface) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="%237d7460" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>') no-repeat right 14px center;
    border:1px solid var(--border);
    border-radius:10px;
    padding:12px 38px 12px 14px;
    font-family:'Inter',sans-serif;
    font-size:16px;
    color:var(--text);
  }
  select:focus{ outline:2px solid var(--accent); outline-offset:1px; }
  .course-info{
    width:100%;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:10px;
    padding:12px 14px;
    font-family:'Inter',sans-serif;
    font-size:16px;
    font-weight:600;
    color:var(--text);
  }
  select optgroup{
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-style:normal;
    color:var(--accent);
    background:var(--surface);
  }
  select option.opt-past{
    color:var(--text-dim);
  }

  .btn-row{ display:flex; gap:10px; margin-top:14px; }
  button{
    flex:1;
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--text);
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:15px;
    padding:13px 12px;
    border-radius:10px;
    cursor:pointer;
    transition:background .15s ease, transform .1s ease;
  }
  button:hover{ background:var(--surface-alt); }
  button:active{ transform:scale(.98); }
  button.primary{
    background:var(--accent);
    border-color:var(--accent);
    color:#fdf8ec;
  }
  button.primary:hover{ background:#163225; }
  button:disabled{
    opacity:.5;
    cursor:not-allowed;
    transform:none;
  }

  .tote{
    background:var(--tote-bg);
    border-radius:var(--radius);
    padding:10px 16px;
    text-align:center;
  }
  .tote-clock{
    font-family:'JetBrains Mono',monospace;
    font-variant-numeric:tabular-nums;
    font-size:26px;
    font-weight:700;
    color:var(--tote-fg);
    letter-spacing:.02em;
  }
  .tote-label{
    font-family:'JetBrains Mono',monospace;
    font-size:9px;
    text-transform:uppercase;
    letter-spacing:.14em;
    color:#9aa89a;
    margin-top:2px;
  }
  .snap-line{
    text-align:center;
    font-size:12px;
    color:var(--text-dim);
    margin-top:4px;
  }
  .status-line{
    text-align:center;
    font-size:11px;
    color:var(--danger);
    min-height:0;
    margin-top:2px;
  }

  .table-wrap{ flex:1; }
  .table-head{
    display:grid;
    grid-template-columns: 1.15fr 76px 76px 76px;
    gap:6px;
    padding:0 12px 8px;
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:.08em;
    color:var(--text-dim);
    font-weight:700;
  }
  .table-head span:not(:first-child){ text-align:center; }

  #rows{
    display:flex;
    flex-direction:column;
    gap:7px;
    position:relative;
  }
  .row{
    display:grid;
    grid-template-columns: 1.15fr 76px 76px 76px;
    gap:6px;
    align-items:center;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:9px;
    padding:12px 14px;
    min-height:51px;
    box-sizing:border-box;
    transition: transform .35s ease, background-color .4s ease;
  }
  .row.row-hidden{ display:none; }
  .row.flash-up{ background:var(--success-bg); }
  .row.flash-down{ background:var(--danger-bg); }
  .horse{
    display:flex;
    align-items:center;
    gap:9px;
    font-size:16px;
    font-weight:600;
    overflow:hidden;
  }
  .num-badge{
    flex:none;
    width:27px; height:27px;
    border-radius:50%;
    background:var(--accent);
    color:#fdf8ec;
    font-family:'JetBrains Mono',monospace;
    font-size:13px;
    font-weight:700;
    display:flex; align-items:center; justify-content:center;
  }
  .horse-name{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .late-badge{ flex:none; font-size:12px; margin-left:2px; }
  .speed-badge{ flex:none; font-size:13px; margin-left:2px; }
  .speed-badge.speed-up{ filter: drop-shadow(0 0 0 var(--success)); }
  .row-late{ border-style:dashed; }
  .cote{
    font-family:'JetBrains Mono',monospace;
    font-variant-numeric:tabular-nums;
    font-size:15px;
    font-weight:700;
    text-align:center;
    color:var(--text);
  }
  .cote-place{
    font-family:'JetBrains Mono',monospace;
    font-variant-numeric:tabular-nums;
    font-size:16px;
    font-weight:600;
    text-align:center;
    color:var(--text-dim);
  }
  .cote-ecart{
    font-family:'JetBrains Mono',monospace;
    font-variant-numeric:tabular-nums;
    font-size:18px;
    font-weight:700;
    text-align:center;
    color:var(--accent-2);
    display:flex;
    align-items:center;
    justify-content:center;
    gap:4px;
  }
  /* Paliers de couleur selon l'écart Gagnant - Placé : plus c'est haut, plus c'est marqué */
  .cote-ecart.ecart-t1{ color:#b8791f; }                 /* 3% <= écart < 5% : ambre */
  .cote-ecart.ecart-t2{ color:#fff; background:var(--danger); border-radius:6px; padding:2px 6px; } /* écart >= 5% : rouge plein */
  .ecart-target{ flex:none; font-size:13px; }
  .fav-badge{ flex:none; font-size:12px; margin-left:2px; color:var(--accent-2); }
  .var{
    font-family:'JetBrains Mono',monospace;
    font-variant-numeric:tabular-nums;
    font-size:17px;
    font-weight:800;
    text-align:center;
    border-radius:7px;
    padding:6px 5px;
    white-space:nowrap;
    line-height:1.2;
  }
  .var.up{ color:var(--success); background:var(--success-bg); }
  .var.down{ color:var(--danger); background:var(--danger-bg); }
  .var.flat{ color:var(--text-dim); background:var(--surface-alt); }

  .empty{
    text-align:center;
    color:var(--text-dim);
    font-size:13px;
    padding:30px 10px;
  }

  .hide-btn{
    flex:none;
    width:20px; height:20px;
    padding:0;
    margin-left:auto;
    border:none;
    background:transparent;
    color:var(--text-dim);
    font-size:13px;
    line-height:1;
    border-radius:5px;
    opacity:.45;
    transition:opacity .15s ease, background .15s ease, color .15s ease;
  }
  .hide-btn:hover{ opacity:1; background:var(--danger-bg); color:var(--danger); }
  .hidden-link{
    text-align:center;
    font-size:12px;
    color:var(--text-dim);
    margin-top:8px;
    cursor:pointer;
    text-decoration:underline;
    text-underline-offset:2px;
  }
  .hidden-link:hover{ color:var(--text); }
</style>
</head>
<body>
<div class="page">

  <div class="brand-title">🐎 TBlaugrana Rang 🐎</div>

  <div class="card" id="selectionCard">
    <div class="field">
      <label>Course suivie</label>
      <div id="courseInfo" class="course-info">Chargement…</div>
    </div>
  </div>

  <div class="tote">
    <div class="tote-clock" id="countdown">--:--</div>
    <div class="tote-label" id="toteLabel"></div>
  </div>
  <div class="snap-line" id="snapLine" style="display:none;">📸 Snapshot : en attente</div>
  <div class="status-line" id="statusLine"></div>

  <div class="table-wrap">
    <div class="table-head">
      <span>Cheval</span><span>Gagnant</span><span>Placé</span><span>Écart</span>
    </div>
    <div id="rows"><div class="empty">Chargement de la course en cours…</div></div>
    <div class="hidden-link" id="hiddenLink" style="display:none;"></div>
  </div>

</div>

<script>
const PMU_BASE_PROG = "/proxy/61";
const PMU_BASE_CITATIONS = "/proxy/citations";
const REFRESH_INTERVAL_MS = 500;      // délai minimal entre deux cycles de poll (2 requêtes/cycle : SG + SP)
const FETCH_TIMEOUT_MS = 4000;        // abandonne un cycle trop lent au lieu d'attendre
const SPEED_WINDOW_MS = 45000;             // fenêtre glissante utilisée pour calculer la vitesse de mouvement (sur le Gagnant)
const SPEED_THRESHOLD_PTS_PER_MIN = 6;     // seuil (points de probabilité implicite / min) au-delà duquel on affiche le badge ⚡
const ECART_TIER1 = 3;                     // écart (%) à partir duquel la cellule Écart passe en ambre + badge 🎯
const ECART_TIER2 = 5;                     // écart (%) à partir duquel la cellule Écart passe en rouge plein
const REPROG_INTERVAL_MS = 45000;          // recharge le programme en tâche de fond toutes les 45s (detecte retards / courses terminées)
const DEPART_CHANGE_THRESHOLD_S = 15;      // écart d'heure de départ (en secondes) à partir duquel on considère que la course a été retardée/avancée
const RACE_STALE_MS = 5 * 60 * 1000;       // bascule vers la course suivante dès que la course suivie est partie depuis plus de 5 min

const today = new Date();

function datePmu(d){
  const dd = String(d.getDate()).padStart(2,'0');
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const yyyy = d.getFullYear();
  return `${dd}${mm}${yyyy}`;
}

function isAnnulee(obj){
  const s = (obj.statut || obj.statutCourse || obj.statutReunion || "");
  return typeof s === "string" && s.toUpperCase().includes("ANNULE");
}

const courseInfoEl = document.getElementById('courseInfo');
const countdownEl = document.getElementById('countdown');
const snapLineEl = document.getElementById('snapLine');
const statusLineEl = document.getElementById('statusLine');
const toteLabelEl = document.getElementById('toteLabel');
const rowsEl = document.getElementById('rows');

let allCourses = [];
let selectedReunion = null;
let selectedCourse = null;
let departTs = null;
let selectedDiscipline = '';
let selectedNbPartants = null;

let favorisOrder = [];   // ordre de suivi des chevaux (num en string)
let horseNames = {};
let rowEls = {};          // num -> élément DOM de la ligne (réutilisé d'un cycle à l'autre)
let lastGagnant = {};     // num -> dernière cote Gagnant affichée (pour détecter les variations et flasher)
let lastPlace = {};       // num -> dernière cote Placé affichée
let oddsHistory = {};     // num -> [{t, prob}] historique glissant (probabilité implicite Gagnant) pour calculer la vitesse
let hiddenHorses = new Set(); // num (string) -> masqués manuellement par l'utilisateur, en mémoire uniquement (reset à chaque nouvelle course)

const hiddenLinkEl = document.getElementById('hiddenLink');

function updateHiddenLink(){
  const n = hiddenHorses.size;
  if(n === 0){
    hiddenLinkEl.style.display = 'none';
    hiddenLinkEl.textContent = '';
  } else {
    hiddenLinkEl.style.display = '';
    hiddenLinkEl.textContent = `👁 afficher ${n} cheval${n>1?'aux':''} masqué${n>1?'s':''}`;
  }
}

hiddenLinkEl.addEventListener('click', ()=>{
  hiddenHorses.clear();
  for(const num in rowEls){
    rowEls[num].classList.remove('row-hidden');
  }
  updateHiddenLink();
});

let pollTimeoutId = null;
let pollAbort = null;
let polling = false;
let reprogTimer = null;

function parseProgramme(data){
  const reunionsRaw = (data.programme && data.programme.reunions) || [];
  const courses = [];
  for(const ru of reunionsRaw){
    if(isAnnulee(ru)) continue;
    const hip = (ru.hippodrome && (ru.hippodrome.libelleCourt || ru.hippodrome.libelleLong)) || `R${ru.numOfficiel}`;
    const numReunion = ru.numOfficiel;
    for(const co of (ru.courses || [])){
      if(isAnnulee(co)) continue;
      courses.push({
        numReunion,
        hip,
        course: co.numOrdre,
        depart: co.heureDepart,
        libelle: co.libelle || co.libelleCourt || `Course ${co.numOrdre}`,
        discipline: co.discipline || '',
        nbPartants: co.nombreDeclaresPartants ?? co.participants ?? null
      });
    }
  }
  courses.sort((a,b)=> (a.depart||0) - (b.depart||0));
  return courses;
}

async function loadProgramme(){
  statusLineEl.textContent = "Chargement du programme…";
  statusLineEl.style.color = "var(--text-dim)";
  try{
    const url = `${PMU_BASE_PROG}/programme/${datePmu(today)}?specialisation=OFFLINE`;
    const res = await fetch(url);
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    allCourses = parseProgramme(data);
    statusLineEl.textContent = `Programme chargé (${allCourses.length} courses)`;
    selectNextCourse();
  }catch(e){
    statusLineEl.textContent = `Erreur programme : ${e.message}`;
    statusLineEl.style.color = "var(--danger)";
  }finally{
    scheduleReprog();
  }
}

function scheduleReprog(){
  if(reprogTimer) clearTimeout(reprogTimer);
  reprogTimer = setTimeout(refreshProgrammeBackground, REPROG_INTERVAL_MS);
}

// Recharge le programme en tâche de fond, sans jamais interrompre le suivi en cours,
// pour détecter : un départ retardé/avancé sur la course suivie, ou sa disparition du
// programme (course terminée) afin d'enchaîner automatiquement sur la suivante.
async function refreshProgrammeBackground(){
  try{
    const url = `${PMU_BASE_PROG}/programme/${datePmu(today)}?specialisation=OFFLINE`;
    const res = await fetch(url, { cache: "no-store" });
    if(res.ok){
      const data = await res.json();
      allCourses = parseProgramme(data);
      handleProgrammeRefresh();
    }
  }catch(e){
    // silencieux : simple échec de fond, on retente au prochain cycle
  }finally{
    scheduleReprog();
  }
}

function handleProgrammeRefresh(){
  const now = Date.now();

  if(selectedReunion === null || selectedCourse === null){
    selectNextCourse();
    return;
  }

  // Bascule vers la course suivante dès que la course suivie est partie depuis plus de
  // RACE_STALE_MS (5 min) — qu'elle soit encore présente au programme ou non.
  if(departTs !== null && (now - departTs * 1000) > RACE_STALE_MS){
    selectNextCourse();
    return;
  }

  const current = allCourses.find(c => c.numReunion === selectedReunion && c.course === selectedCourse);

  if(current){
    const newDepartTs = current.depart / 1000.0;
    selectedDiscipline = current.discipline;
    selectedNbPartants = current.nbPartants;

    if(departTs !== null && Math.abs(newDepartTs - departTs) > DEPART_CHANGE_THRESHOLD_S){
      const wasDelayed = newDepartTs > departTs;
      departTs = newDepartTs;
      courseInfoEl.textContent = formatCourseLabel(current);
      updateToteLabel();
      if(wasDelayed){
        snapLineEl.textContent = "⏱ Départ retardé — suivi maintenu…";
      }
    } else {
      courseInfoEl.textContent = formatCourseLabel(current);
      updateToteLabel();
    }
    return;
  }

  // La course suivie a disparu du programme mais n'est pas encore partie depuis 5 min :
  // on continue simplement de la suivre (le contrôle ci-dessus prendra le relais dès que
  // le délai de 5 min sera écoulé).
}

function formatCourseLabel(c){
  let hhmm = "";
  if(c.depart){
    const dt = new Date(c.depart);
    hhmm = dt.toTimeString().slice(0,5);
  }
  return `${hhmm} — R${c.numReunion}C${c.course} — ${c.hip} — ${c.libelle}`;
}

function selectNextCourse(){
  // Choisit automatiquement la prochaine course à venir (la plus proche de son départ),
  // et lance directement le suivi dessus — sans aucune action de l'utilisateur.
  const now = Date.now();
  const upcoming = allCourses.filter(c => c.depart && c.depart >= now);
  const chosen = upcoming.length ? upcoming[0] : (allCourses.length ? allCourses[allCourses.length - 1] : null);

  if(!chosen){
    courseInfoEl.textContent = "Aucune course disponible.";
    statusLineEl.textContent = "Aucune course disponible pour le moment.";
    statusLineEl.style.color = "var(--danger)";
    return;
  }

  selectedReunion = chosen.numReunion;
  selectedCourse = chosen.course;
  departTs = chosen.depart / 1000.0;
  selectedDiscipline = chosen.discipline;
  selectedNbPartants = chosen.nbPartants;
  courseInfoEl.textContent = formatCourseLabel(chosen);
  updateToteLabel();
  startTracking();
}

function updateToteLabel(nbLive){
  const parts = [];
  if(selectedDiscipline) parts.push(selectedDiscipline);
  const nb = (nbLive !== undefined && nbLive !== null) ? nbLive : selectedNbPartants;
  if(nb !== null && nb !== undefined) parts.push(`${nb} partant${nb>1?'s':''}`);
  toteLabelEl.textContent = parts.join(' · ');
}

function startTracking(){
  if(selectedReunion === null || selectedCourse === null) return;
  favorisOrder = [];
  horseNames = {};
  rowEls = {};
  lastGagnant = {};
  lastPlace = {};
  oddsHistory = {};
  hiddenHorses.clear();
  updateHiddenLink();
  rowsEl.innerHTML = "";
  snapLineEl.style.display = "";
  snapLineEl.textContent = "📡 Rapports probables : en attente";

  if(pollTimeoutId) clearTimeout(pollTimeoutId);
  if(pollAbort) pollAbort.abort();
  polling = true;
  pollOnce();
}

function stopTracking(){
  polling = false;
  if(pollTimeoutId) clearTimeout(pollTimeoutId);
  if(pollAbort) pollAbort.abort();
}

// Extrait, depuis UNE réponse /citations (qui contient en réalité les deux pools
// SIMPLE_GAGNANT et SIMPLE_PLACE quel que soit le paramètre "paris" demandé),
// les maps numPmu -> {nom, ratio, favoris} pour chacun des deux types de pari.
function parseCitations(data){
  const gagnantMap = {};
  const placeMap = {};
  const groupes = (data && data.listeCitations) || [];
  for(const g of groupes){
    const target = g.typePari === "SIMPLE_PLACE" ? placeMap
                 : g.typePari === "SIMPLE_GAGNANT" ? gagnantMap
                 : null;
    if(!target) continue;
    for(const p of (g.participants || [])){
      if(p.statut !== "PARTANT") continue;
      const cits = p.citations || [];
      const ratio = cits.length ? cits[0].ratio : undefined;
      if(ratio === undefined || ratio === null) continue;
      target[p.numPmu] = { nom: p.nom || `#${p.numPmu}`, ratio, favoris: !!p.favoris };
    }
  }
  return { gagnantMap, placeMap };
}

async function pollOnce(){
  if(!polling) return;
  const controller = new AbortController();
  pollAbort = controller;
  const killer = setTimeout(()=>controller.abort(), FETCH_TIMEOUT_MS);
  const startedAt = performance.now();
  try{
    // Un seul appel : la réponse contient déjà les pools SIMPLE_GAGNANT et SIMPLE_PLACE
    // ensemble (le paramètre "paris" ne filtre pas le résultat côté PMU), inutile
    // d'interroger deux fois — cela évite aussi un éventuel 404 sur une requête en double.
    const url = `${PMU_BASE_CITATIONS}/programme/${datePmu(today)}/R${selectedReunion}/C${selectedCourse}/citations?paris=SIMPLE_GAGNANT&specialisation=OFFLINE&groupe=true`;
    const res = await fetch(url, { signal: controller.signal, cache: "no-store" });
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    statusLineEl.textContent = "";
    handleOdds(data);
  }catch(e){
    if(e.name !== "AbortError"){
      statusLineEl.textContent = `Erreur cotes : ${e.message}`;
      statusLineEl.style.color = "var(--danger)";
    }
  }finally{
    clearTimeout(killer);
    if(polling){
      // planifie le prochain cycle dès que possible, en respectant l'intervalle minimal
      // (jamais deux cycles en vol en même temps -> pas d'empilement en cas de lenteur réseau)
      const elapsed = performance.now() - startedAt;
      const wait = Math.max(0, REFRESH_INTERVAL_MS - elapsed);
      pollTimeoutId = setTimeout(pollOnce, wait);
    }
  }
}

function handleOdds(data){
  const { gagnantMap, placeMap } = parseCitations(data);

  const nums = new Set([...Object.keys(gagnantMap), ...Object.keys(placeMap)]);
  if(nums.size === 0) return;
  updateToteLabel(nums.size);

  for(const num of nums){
    const nom = (gagnantMap[num] && gagnantMap[num].nom) || (placeMap[num] && placeMap[num].nom) || `#${num}`;
    horseNames[num] = nom;
    if(!favorisOrder.includes(num)) favorisOrder.push(num);
  }

  const speedMap = updateSpeedHistory(gagnantMap);

  const now = new Date();
  snapLineEl.textContent = `📡 Rapports probables mis à jour — ${now.toTimeString().slice(0,8)}`;

  renderTable(gagnantMap, placeMap, speedMap);
}

// Calcule, pour chaque cheval, la vitesse de variation de sa probabilité implicite Gagnant
// (en points de probabilité par minute) sur une fenêtre glissante récente.
// Utile pour repérer les mouvements brusques ("steam moves").
function updateSpeedHistory(gagnantMap){
  const now = Date.now();
  const speed = {};
  for(const [num, info] of Object.entries(gagnantMap)){
    const cote = info.ratio;
    if(!cote || cote <= 0) continue;
    const prob = 100 / cote;
    if(!oddsHistory[num]) oddsHistory[num] = [];
    const hist = oddsHistory[num];
    hist.push({ t: now, prob });
    while(hist.length > 1 && now - hist[0].t > SPEED_WINDOW_MS) hist.shift();
    if(hist.length >= 2){
      const first = hist[0];
      const minutes = (now - first.t) / 60000;
      if(minutes > 0){
        speed[num] = (prob - first.prob) / minutes;
      }
    }
  }
  return speed;
}

function buildRow(num){
  const row = document.createElement('div');
  row.className = 'row';
  row.dataset.num = num;
  row.innerHTML = `
    <div class="horse"><span class="num-badge"></span><span class="horse-name"></span><span class="speed-badge" style="display:none;"></span><button class="hide-btn" title="Masquer ce cheval" aria-label="Masquer ce cheval">✕</button></div>
    <div class="cote"></div>
    <div class="cote-place"></div>
    <div class="cote-ecart"><span class="ecart-value"></span><span class="ecart-target" style="display:none;">🎯</span></div>
  `;
  row.querySelector('.num-badge').textContent = num;
  row.querySelector('.hide-btn').addEventListener('click', ()=>{
    hiddenHorses.add(num);
    row.classList.add('row-hidden');
    updateHiddenLink();
  });
  return row;
}

// Écart entre la valeur Gagnant et la valeur Placé (différence signée : Gagnant - Placé)
function computeEcart(coteG, coteP){
  if(coteG === undefined || coteG === null || coteP === undefined || coteP === null) return undefined;
  return coteG - coteP;
}

function renderTable(gagnantMap, placeMap, speedMap){
  const emptyMsg = rowsEl.querySelector('.empty');
  if(favorisOrder.length === 0){
    if(!emptyMsg) rowsEl.innerHTML = '<div class="empty">Aucun cheval avec une cote disponible pour le moment.</div>';
    return;
  }
  if(emptyMsg) emptyMsg.remove();

  // mémorise les positions actuelles (avant réordonnancement) pour l'animation FLIP
  const prevRects = {};
  for(const num in rowEls){
    prevRects[num] = rowEls[num].getBoundingClientRect();
  }

  // Trie par écart (Gagnant % - Placé %) décroissant : les chevaux avec le plus grand
  // écart entre leur probabilité Gagnant et leur probabilité Placé en tête. Les chevaux
  // pour lesquels l'écart ne peut pas être calculé (cote manquante d'un côté) sont
  // relégués en fin de liste.
  const displayOrder = [...favorisOrder].sort((a,b)=>{
    const ea = computeEcart(gagnantMap[a] && gagnantMap[a].ratio, placeMap[a] && placeMap[a].ratio);
    const eb = computeEcart(gagnantMap[b] && gagnantMap[b].ratio, placeMap[b] && placeMap[b].ratio);
    if(ea === undefined && eb === undefined) return 0;
    if(ea === undefined) return 1;
    if(eb === undefined) return -1;
    return eb - ea;
  });

  const TOP_N = 5;

  displayOrder.forEach((num, idx)=>{
    const nom = horseNames[num] || `#${num}`;
    const gInfo = gagnantMap[num];
    const pInfo = placeMap[num];
    const coteG = gInfo ? gInfo.ratio : undefined;
    const coteP = pInfo ? pInfo.ratio : undefined;
    const isFavori = !!(gInfo && gInfo.favoris);

    const ecart = computeEcart(coteG, coteP);

    const coteGStr = coteG !== undefined ? `${coteG.toFixed(2)}%` : "—";
    const cotePStr = coteP !== undefined ? `${coteP.toFixed(2)}%` : "—";
    const ecartStr = ecart !== undefined ? `${ecart >= 0 ? '+' : ''}${ecart.toFixed(2)}%` : "—";

    // tous les chevaux sont affichés (plus de masquage au-delà d'un seuil de cote)

    // réutilise l'élément DOM existant plutôt que d'en recréer un (évite le reflow complet)
    let row = rowEls[num];
    if(!row){
      row = buildRow(num);
      rowEls[num] = row;
    }

    const nameEl = row.querySelector('.horse-name');
    if(nameEl.textContent !== nom) nameEl.textContent = nom;

    if(isFavori && !row.querySelector('.fav-badge')){
      const badge = document.createElement('span');
      badge.className = 'fav-badge';
      badge.title = 'Favori des rapports probables';
      badge.textContent = '★';
      row.querySelector('.horse').appendChild(badge);
    } else if(!isFavori){
      const existing = row.querySelector('.fav-badge');
      if(existing) existing.remove();
    }

    const coteEl = row.querySelector('.cote');
    if(coteEl.textContent !== coteGStr){
      coteEl.textContent = coteGStr;
      // flash bref de la ligne quand la cote Gagnant bouge (cote qui baisse = favori qui se renforce)
      const prevC = lastGagnant[num];
      if(prevC !== undefined && coteG !== undefined && coteG !== prevC){
        row.classList.remove('flash-up','flash-down');
        void row.offsetWidth; // relance l'animation CSS
        row.classList.add(coteG < prevC ? 'flash-up' : 'flash-down');
        clearTimeout(row._flashTimer);
        row._flashTimer = setTimeout(()=>row.classList.remove('flash-up','flash-down'), 500);
      }
    }
    if(coteG !== undefined) lastGagnant[num] = coteG;

    const cotePEl = row.querySelector('.cote-place');
    if(cotePEl.textContent !== cotePStr) cotePEl.textContent = cotePStr;
    if(coteP !== undefined) lastPlace[num] = coteP;

    const ecartEl = row.querySelector('.cote-ecart');
    const ecartValueEl = ecartEl.querySelector('.ecart-value');
    const ecartTargetEl = ecartEl.querySelector('.ecart-target');
    if(ecartValueEl.textContent !== ecartStr) ecartValueEl.textContent = ecartStr;

    // Code couleur progressif + badge 🎯 dès que l'écart atteint le premier palier
    ecartEl.classList.remove('ecart-t1', 'ecart-t2');
    if(ecart !== undefined && ecart >= ECART_TIER2){
      ecartEl.classList.add('ecart-t2');
    } else if(ecart !== undefined && ecart >= ECART_TIER1){
      ecartEl.classList.add('ecart-t1');
    }
    ecartTargetEl.style.display = (ecart !== undefined && ecart >= ECART_TIER1) ? 'inline' : 'none';

    // badge ⚡ : n'apparaît que si le mouvement récent (sur le Gagnant) dépasse le seuil de vitesse
    const spd = speedMap ? speedMap[num] : undefined;
    const isFast = spd !== undefined && Math.abs(spd) >= SPEED_THRESHOLD_PTS_PER_MIN;
    const speedEl = row.querySelector('.speed-badge');
    if(speedEl){
      speedEl.style.display = isFast ? 'inline' : 'none';
      if(isFast){
        speedEl.textContent = '⚡';
        speedEl.style.color = spd > 0 ? 'var(--danger)' : 'var(--success)';
        speedEl.title = `Mouvement rapide : ${spd > 0 ? '+' : ''}${spd.toFixed(1)} pts de probabilité/min (Gagnant)`;
      }
    }

    // ne montre que le top 5 du classement (par écart) ; un cheval qui retombe hors du
    // top 5 est simplement masqué (pas supprimé) donc il réapparaît instantanément dès
    // qu'il revient dans les 5 premiers au prochain rafraîchissement.
    // Un cheval masqué manuellement par l'utilisateur (hiddenHorses) reste masqué même
    // s'il fait partie du top 5, jusqu'à ce qu'il clique sur "afficher les masqués".
    row.classList.toggle('row-hidden', idx >= TOP_N || hiddenHorses.has(num));

    // réordonne : appendChild déplace le nœud existant, il n'est jamais recréé
    rowsEl.appendChild(row);
  });

  // supprime les lignes de chevaux qui ne sont plus dans favorisOrder (cas très rare)
  for(const num in rowEls){
    if(!displayOrder.includes(num)){
      rowEls[num].remove();
      delete rowEls[num];
    }
  }

  // anime le repositionnement (FLIP) — ignore les lignes masquées (pas de position valide)
  rowsEl.querySelectorAll('.row:not(.row-hidden)').forEach(el=>{
    const prev = prevRects[el.dataset.num];
    if(prev){
      const next = el.getBoundingClientRect();
      const dy = prev.top - next.top;
      if(dy !== 0){
        el.style.transition = "none";
        el.style.transform = `translateY(${dy}px)`;
        requestAnimationFrame(()=>{
          el.style.transition = "transform .35s ease, background-color .4s ease";
          el.style.transform = "translateY(0)";
        });
      }
    }
  });
}

function tickCountdown(){
  if(departTs !== null){
    const secs = Math.floor(departTs - (Date.now()/1000));
    countdownEl.textContent = fmtCountdown(secs);
  }
}

function fmtCountdown(secs){
  if(secs >= 0){
    const h = Math.floor(secs/3600);
    const m = Math.floor((secs%3600)/60);
    const s = secs%60;
    if(h > 0) return `${h}h${String(m).padStart(2,'0')}`;
    return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  } else {
    const elapsed = Math.abs(secs);
    const m = Math.floor(elapsed/60);
    const s = elapsed%60;
    return `Partie ${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  }
}

setInterval(tickCountdown, 500);
loadProgramme();
</script>
