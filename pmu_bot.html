<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TBlaugrana Turf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f3efe3;
    --surface:#fffdf8;
    --surface-alt:#ece4d0;
    --border:#ddd3b8;
    --text:#1f2a22;
    --text-dim:#7d7460;
    --accent:#1f3d2c;
    --accent-2:#8b5e34;
    --success:#2f7a4f;
    --success-bg:#e4efe6;
    --danger:#b23a2e;
    --danger-bg:#f6e6e2;
    --tote-bg:#14201a;
    --tote-fg:#e8b24d;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
  }
  .page{
    max-width:600px;
    margin:0 auto;
    min-height:100vh;
    padding:8px 18px 14px;
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .eyebrow{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--accent-2);
    font-weight:500;
  }
  h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:30px;
    line-height:1.05;
    margin:4px 0 2px;
    color:var(--accent);
  }
  .subtitle{
    font-size:13px;
    color:var(--text-dim);
  }
  .subtitle b{ color:var(--text); font-weight:600; }

  .brand-title{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:32px;
    line-height:1;
    color:var(--accent);
    text-align:center;
    letter-spacing:.015em;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    margin:14px 0 22px;
  }

  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:16px 18px;
  }

  .btn-row-compact button{
    font-size:13px;
    padding:9px 10px;
  }

  .field{ margin-bottom:12px; }
  .field:last-child{ margin-bottom:0; }
  label{
    display:block;
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:.08em;
    color:var(--text-dim);
    margin-bottom:5px;
    font-weight:600;
  }
  select{
    width:100%;
    appearance:none;
    -webkit-appearance:none;
    background:var(--surface) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="%237d7460" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>') no-repeat right 14px center;
    border:1px solid var(--border);
    border-radius:10px;
    padding:12px 38px 12px 14px;
    font-family:'Inter',sans-serif;
    font-size:16px;
    color:var(--text);
  }
  select:focus{ outline:2px solid var(--accent); outline-offset:1px; }
  .course-info{
    width:100%;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:10px;
    padding:12px 14px;
    font-family:'Inter',sans-serif;
    font-size:16px;
    font-weight:600;
    color:var(--text);
  }
  select optgroup{
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-style:normal;
    color:var(--accent);
    background:var(--surface);
  }
  select option.opt-past{
    color:var(--text-dim);
  }

  .btn-row{ display:flex; gap:10px; margin-top:14px; }
  button{
    flex:1;
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--text);
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:15px;
    padding:13px 12px;
    border-radius:10px;
    cursor:pointer;
    transition:background .15s ease, transform .1s ease;
  }
  button:hover{ background:var(--surface-alt); }
  button:active{ transform:scale(.98); }
  button.primary{
    background:var(--accent);
    border-color:var(--accent);
    color:#fdf8ec;
  }
  button.primary:hover{ background:#163225; }
  button:disabled{
    opacity:.5;
    cursor:not-allowed;
    transform:none;
  }

  .tote{
    background:var(--tote-bg);
    border-radius:var(--radius);
    padding:10px 16px;
    text-align:center;
    margin-top:16px;
  }
  .tote-clock{
    font-family:'JetBrains Mono',monospace;
    font-variant-numeric:tabular-nums;
    font-size:26px;
    font-weight:700;
    color:var(--tote-fg);
    letter-spacing:.02em;
  }
  .tote-label{
    font-family:'JetBrains Mono',monospace;
    font-size:9px;
    text-transform:uppercase;
    letter-spacing:.14em;
    color:#9aa89a;
    margin-top:2px;
  }
  .snap-line{
    text-align:center;
    font-size:12px;
    color:var(--text-dim);
    margin-top:4px;
  }
  .status-line{
    text-align:center;
    font-size:11px;
    color:var(--danger);
    min-height:0;
    margin-top:2px;
  }

  .table-wrap{ flex:1; }
  .table-head{
    display:grid;
    grid-template-columns: 1fr 62px 62px 62px;
    gap:8px;
    align-items:center;
    padding:0 12px 6px;
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:.06em;
    color:var(--text-dim);
    font-weight:700;
  }
  .table-head span:not(:first-child){ text-align:right; }

  #rows{
    display:flex;
    flex-direction:column;
    gap:6px;
    position:relative;
  }
  .row{
    position:relative;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:9px;
    padding:9px 12px;
    box-sizing:border-box;
    display:grid;
    grid-template-columns: 1fr 62px 62px 62px;
    gap:8px;
    align-items:center;
    transition: transform .35s ease, background-color .4s ease;
  }
  .row.row-hidden{ display:none; }
  .row.flash-up{ background:var(--success-bg); }
  .row.flash-down{ background:var(--danger-bg); }

  /* Un seul signal visuel fort, réservé au cheval ayant franchi le seuil de
     chute VALUEBET_THRESHOLD_PCT. */
  .row.row-valuebet{
    border:2px solid var(--tote-fg);
    background:linear-gradient(0deg, rgba(232,178,77,.12), rgba(232,178,77,.12)), var(--surface);
    box-shadow:0 0 0 3px rgba(232,178,77,.16);
  }
  .valuebet-tag{
    position:absolute;
    top:-10px; left:10px;
    background:var(--tote-bg);
    color:var(--tote-fg);
    font-family:'JetBrains Mono',monospace;
    font-size:9.5px;
    font-weight:700;
    letter-spacing:.06em;
    text-transform:uppercase;
    padding:3px 8px;
    border-radius:20px;
    display:none;
  }
  .row.row-valuebet .valuebet-tag{ display:inline-block; }

  .horse{
    display:flex;
    align-items:center;
    gap:9px;
    min-width:0;
  }
  .num-badge{
    flex:none;
    width:27px; height:27px;
    border-radius:50%;
    background:var(--accent);
    color:#fdf8ec;
    font-family:'JetBrains Mono',monospace;
    font-size:13px;
    font-weight:700;
    display:flex; align-items:center; justify-content:center;
  }
  .horse-name{
    flex:1;
    min-width:0;
    font-size:14.5px;
    font-weight:600;
    color:var(--text);
    white-space:normal;
    line-height:1.15;
  }
  .late-badge{ flex:none; font-size:12px; margin-left:2px; }
  .row-late{ border-style:dashed; }

  .cote-ref, .cote, .ecart{
    font-family:'JetBrains Mono',monospace;
    font-variant-numeric:tabular-nums;
    font-weight:700;
    font-size:14px;
    text-align:right;
  }
  .cote{ color:var(--accent); }
  .cote-ref{ font-weight:600; color:var(--text-dim); }
  .cote-ref.up, .ecart.up{ color:var(--success); }
  .cote-ref.down, .ecart.down{ color:var(--danger); }
  .cote-ref.flat, .ecart.flat{ color:var(--text-dim); }

  .empty{
    text-align:center;
    color:var(--text-dim);
    font-size:13px;
    padding:30px 10px;
  }
</style>
</head>
<body>
<div class="page">

  <div class="brand-title">🐎 TBlaugrana Turf 🐎</div>

  <div class="card" id="selectionCard">
    <div class="field">
      <label>Course suivie</label>
      <div id="courseInfo" class="course-info">Chargement…</div>
    </div>
  </div>

  <div class="tote">
    <div class="tote-clock" id="countdown">--:--</div>
    <div class="tote-label" id="toteLabel"></div>
  </div>
  <div class="snap-line" id="snapLine" style="display:none;">📸 Snapshot : en attente</div>
  <div class="status-line" id="statusLine"></div>

  <div class="table-wrap">
    <div class="table-head">
      <span>Cheval</span>
      <span>-3min</span>
      <span>Live</span>
      <span>Écart</span>
    </div>
    <div id="rows"><div class="empty">Chargement de la course en cours…</div></div>
  </div>

</div>

<script>
// -----------------------------------------------------------------------
// Client "léger" : tout le suivi (programme, cotes, historique, vitesse,
// top 5) est calculé côté serveur (server.py), en continu, indépendamment
// du fait qu'un onglet soit ouvert ou non. Cette page se contente d'interroger
// périodiquement /api/state et d'afficher ce que le serveur renvoie.
// -> Fermer l'onglet ne fait donc plus perdre aucune donnée : au retour,
//    le serveur renvoie l'état à jour (course en cours, cotes, historique).
// -----------------------------------------------------------------------
const POLL_INTERVAL_MS = 700;   // rythme de rafraîchissement de l'affichage (le serveur, lui, interroge PMU toutes les 500ms)
const FETCH_TIMEOUT_MS = 5000;

const courseInfoEl = document.getElementById('courseInfo');
const countdownEl = document.getElementById('countdown');
const snapLineEl = document.getElementById('snapLine');
const statusLineEl = document.getElementById('statusLine');
const toteLabelEl = document.getElementById('toteLabel');
const rowsEl = document.getElementById('rows');

let rowEls = {};        // num -> élément DOM de la ligne (réutilisé d'un cycle à l'autre)
let lastGagnant = {};   // num -> dernière cote Gagnant affichée (pour détecter les variations et flasher)
let departTs = null;
let pollTimer = null;

function fmtCountdown(secs){
  if(secs >= 0){
    const h = Math.floor(secs/3600);
    const m = Math.floor((secs%3600)/60);
    const s = secs%60;
    if(h > 0) return `${h}h${String(m).padStart(2,'0')}`;
    return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  } else {
    const elapsed = Math.abs(secs);
    const m = Math.floor(elapsed/60);
    const s = elapsed%60;
    return `Partie ${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  }
}

function tickCountdown(){
  if(departTs !== null){
    const secs = Math.floor(departTs - (Date.now()/1000));
    countdownEl.textContent = fmtCountdown(secs);
  }
}

function buildRow(num){
  const row = document.createElement('div');
  row.className = 'row';
  row.dataset.num = num;
  row.innerHTML = `
    <span class="valuebet-tag">🔥 VALUEBET 🔥</span>
    <div class="horse">
      <span class="num-badge"></span>
      <span class="horse-name"><span class="name-text"></span></span>
    </div>
    <span class="cote-ref flat">—</span>
    <span class="cote">—</span>
    <span class="ecart flat">—</span>
  `;
  row.querySelector('.num-badge').textContent = num;
  return row;
}

function renderTable(rows, tableMsg){
  const emptyMsg = rowsEl.querySelector('.empty');
  if(!rows || rows.length === 0){
    const msg = tableMsg || 'Aucun cheval avec une cote disponible pour le moment.';
    if(!emptyMsg || emptyMsg.textContent !== msg){
      rowsEl.innerHTML = `<div class="empty">${msg}</div>`;
    }
    return;
  }
  if(emptyMsg) emptyMsg.remove();

  const prevRects = {};
  for(const num in rowEls){
    prevRects[num] = rowEls[num].getBoundingClientRect();
  }

  rows.forEach(r=>{
    const num = r.num;
    const nom = r.nom || `#${num}`;
    const coteRef = (r.coteRef === null || r.coteRef === undefined) ? undefined : r.coteRef;
    const coteLive = (r.coteLive === null || r.coteLive === undefined) ? undefined : r.coteLive;
    const ecart = (r.ecart === null || r.ecart === undefined) ? undefined : r.ecart;

    const coteRefStr = coteRef !== undefined ? coteRef.toFixed(1) : "—";
    const coteLiveStr = coteLive !== undefined ? coteLive.toFixed(1) : "—";
    const ecartStr = ecart !== undefined ? `${ecart >= 0 ? '-' : '+'}${Math.abs(ecart).toFixed(1)}%` : "—";

    let row = rowEls[num];
    if(!row){
      row = buildRow(num);
      rowEls[num] = row;
    }

    const nameTextEl = row.querySelector('.name-text');
    if(nameTextEl.textContent !== nom) nameTextEl.textContent = nom;

    // cote live : valeur mise en avant, avec flash haut/bas comme avant
    const coteEl = row.querySelector('.cote');
    if(coteEl.textContent !== coteLiveStr){
      coteEl.textContent = coteLiveStr;
      const prevC = lastGagnant[num];
      if(prevC !== undefined && coteLive !== undefined && coteLive !== prevC){
        row.classList.remove('flash-up','flash-down');
        void row.offsetWidth;
        row.classList.add(coteLive < prevC ? 'flash-up' : 'flash-down');
        clearTimeout(row._flashTimer);
        row._flashTimer = setTimeout(()=>row.classList.remove('flash-up','flash-down'), 500);
      }
    }
    if(coteLive !== undefined) lastGagnant[num] = coteLive;

    // cote de référence (figée ~3 min avant le départ)
    const coteRefEl = row.querySelector('.cote-ref');
    if(coteRefEl.textContent !== coteRefStr) coteRefEl.textContent = coteRefStr;
    coteRefEl.classList.remove('up','down','flat');
    coteRefEl.classList.add('flat');

    // écart (chute) entre référence et live : positif = la cote a chuté
    const ecartEl = row.querySelector('.ecart');
    if(ecartEl.textContent !== ecartStr) ecartEl.textContent = ecartStr;
    ecartEl.classList.remove('up','down','flat');
    if(ecart === undefined) ecartEl.classList.add('flat');
    else if(ecart > 0) ecartEl.classList.add('up');     // cote en baisse = cheval de plus en plus joue -> vert
    else if(ecart < 0) ecartEl.classList.add('down');   // cote qui remonte = cheval delaisse -> rouge
    else ecartEl.classList.add('flat');

    // Signal "VALUEBET" : marquage DÉFINITIF calculé côté serveur. Dès qu'un
    // cheval franchit 30% de chute (référence -3min vs cote live), il reste
    // marqué "valuebet" pour le reste de la course, même si sa cote remonte
    // ensuite — et il reste visible dans le tableau même s'il sort du top 5.
    const isValuebet = !!r.isValuebet;
    const valuebetEl = row.querySelector('.valuebet-tag');
    if(valuebetEl && isValuebet){
      valuebetEl.title = `Chute de cote ≥ 30% par rapport à la référence -3min (${ecartStr})`;
    }
    row.classList.toggle('row-valuebet', isValuebet);

    // ne montre que les TOP_N_CHUTE chevaux (5) dont la cote a le plus chuté
    // depuis la référence -3min ; un cheval qui sort du classement est
    // simplement masqué (pas supprimé) donc il réapparaît instantanément
    // dès qu'il y revient — calcul fait côté serveur, en continu
    row.classList.toggle('row-hidden', !!r.hidden);

    rowsEl.appendChild(row);
  });

  const presentNums = new Set(rows.map(r=>r.num));
  for(const num in rowEls){
    if(!presentNums.has(num)){
      rowEls[num].remove();
      delete rowEls[num];
    }
  }


  rowsEl.querySelectorAll('.row:not(.row-hidden)').forEach(el=>{
    const prev = prevRects[el.dataset.num];
    if(prev){
      const next = el.getBoundingClientRect();
      const dy = prev.top - next.top;
      if(dy !== 0){
        el.style.transition = "none";
        el.style.transform = `translateY(${dy}px)`;
        requestAnimationFrame(()=>{
          el.style.transition = "transform .35s ease, background-color .4s ease";
          el.style.transform = "translateY(0)";
        });
      }
    }
  });
}

function applyState(data){
  courseInfoEl.textContent = data.courseInfo || 'Chargement…';
  departTs = data.departTs;
  toteLabelEl.textContent = data.toteLabel || '';

  if(data.snapLine){
    snapLineEl.textContent = data.snapLine;
  }
  snapLineEl.style.display = 'none';

  if(data.statusLine){
    statusLineEl.textContent = data.statusLine;
    statusLineEl.style.color = data.statusLine.startsWith('Erreur') ? 'var(--danger)' : 'var(--text-dim)';
  } else {
    statusLineEl.textContent = '';
  }

  renderTable(data.rows, data.tableMsg);
}

async function pollState(){
  const controller = new AbortController();
  const killer = setTimeout(()=>controller.abort(), FETCH_TIMEOUT_MS);
  try{
    const res = await fetch('/api/state', { signal: controller.signal, cache: "no-store" });
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    applyState(data);
  }catch(e){
    if(e.name !== "AbortError"){
      statusLineEl.textContent = `Connexion au serveur perdue, nouvelle tentative… (${e.message})`;
      statusLineEl.style.color = "var(--danger)";
    }
  }finally{
    clearTimeout(killer);
    pollTimer = setTimeout(pollState, POLL_INTERVAL_MS);
  }
}

setInterval(tickCountdown, 500);
pollState();
</script>
</body>
</html>
