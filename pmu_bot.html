<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TBlaugrana Turf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f3efe3;
    --surface:#fffdf8;
    --surface-alt:#ece4d0;
    --border:#ddd3b8;
    --text:#1f2a22;
    --text-dim:#7d7460;
    --accent:#1f3d2c;
    --accent-2:#8b5e34;
    --success:#2f7a4f;
    --success-bg:#e4efe6;
    --danger:#b23a2e;
    --danger-bg:#f6e6e2;
    --tote-bg:#14201a;
    --tote-fg:#e8b24d;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
  }
  .page{
    max-width:600px;
    margin:0 auto;
    min-height:100vh;
    padding:8px 18px 14px;
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .eyebrow{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--accent-2);
    font-weight:500;
  }
  h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:30px;
    line-height:1.05;
    margin:4px 0 2px;
    color:var(--accent);
  }
  .subtitle{
    font-size:13px;
    color:var(--text-dim);
  }
  .subtitle b{ color:var(--text); font-weight:600; }

  .brand-title{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:32px;
    line-height:1;
    color:var(--accent);
    text-align:center;
    letter-spacing:.015em;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    margin:14px 0 22px;
  }

  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:16px 18px;
  }

  .btn-row-compact button{
    font-size:13px;
    padding:9px 10px;
  }

  .field{ margin-bottom:12px; }
  .field:last-child{ margin-bottom:0; }
  label{
    display:block;
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:.08em;
    color:var(--text-dim);
    margin-bottom:5px;
    font-weight:600;
  }
  select{
    width:100%;
    appearance:none;
    -webkit-appearance:none;
    background:var(--surface) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="%237d7460" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>') no-repeat right 14px center;
    border:1px solid var(--border);
    border-radius:10px;
    padding:12px 38px 12px 14px;
    font-family:'Inter',sans-serif;
    font-size:16px;
    color:var(--text);
  }
  select:focus{ outline:2px solid var(--accent); outline-offset:1px; }
  .course-info{
    width:100%;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:10px;
    padding:12px 14px;
    font-family:'Inter',sans-serif;
    font-size:16px;
    font-weight:600;
    color:var(--text);
  }
  select optgroup{
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-style:normal;
    color:var(--accent);
    background:var(--surface);
  }
  select option.opt-past{
    color:var(--text-dim);
  }

  .btn-row{ display:flex; gap:10px; margin-top:14px; }
  button{
    flex:1;
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--text);
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:15px;
    padding:13px 12px;
    border-radius:10px;
    cursor:pointer;
    transition:background .15s ease, transform .1s ease;
  }
  button:hover{ background:var(--surface-alt); }
  button:active{ transform:scale(.98); }
  button.primary{
    background:var(--accent);
    border-color:var(--accent);
    color:#fdf8ec;
  }
  button.primary:hover{ background:#163225; }
  button:disabled{
    opacity:.5;
    cursor:not-allowed;
    transform:none;
  }

  .tote{
    background:var(--tote-bg);
    border-radius:var(--radius);
    padding:10px 16px;
    text-align:center;
  }
  .tote-clock{
    font-family:'JetBrains Mono',monospace;
    font-variant-numeric:tabular-nums;
    font-size:26px;
    font-weight:700;
    color:var(--tote-fg);
    letter-spacing:.02em;
  }
  .tote-label{
    font-family:'JetBrains Mono',monospace;
    font-size:9px;
    text-transform:uppercase;
    letter-spacing:.14em;
    color:#9aa89a;
    margin-top:2px;
  }
  .tote-label-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    margin-top:2px;
  }
  .discipline-badge{
    font-family:'JetBrains Mono',monospace;
    font-size:9px;
    font-weight:700;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--tote-bg);
    background:var(--tote-fg);
    padding:2px 7px;
    border-radius:20px;
    display:none;
  }
  .discipline-badge.show{ display:inline-block; }
  .snap-line{
    text-align:center;
    font-size:12px;
    color:var(--text-dim);
    margin-top:4px;
  }
  .status-line{
    text-align:center;
    font-size:11px;
    color:var(--danger);
    min-height:0;
    margin-top:2px;
  }

  .table-wrap{ flex:1; display:flex; flex-direction:column; gap:14px; }
  .strategy-section{ display:flex; flex-direction:column; gap:6px; }
  .strategy-title{
    display:flex;
    align-items:center;
    gap:7px;
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:16px;
    color:var(--accent);
    padding:0 2px;
  }
  .strategy-title .discipline-tag{
    font-family:'JetBrains Mono',monospace;
    font-size:9px;
    font-weight:700;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--text-dim);
    background:var(--surface-alt);
    border:1px solid var(--border);
    padding:2px 7px;
    border-radius:20px;
  }
  .strategy-body{
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .strategy-body .empty{
    padding:16px 10px;
  }
  .pick-card{
    background:var(--surface);
    border:2px solid var(--tote-fg);
    border-radius:9px;
    padding:11px 14px;
    display:flex;
    align-items:center;
    gap:11px;
    box-shadow:0 0 0 3px rgba(232,178,77,.14);
  }
  .pick-card .num-badge{
    flex:none;
    width:30px; height:30px;
    border-radius:50%;
    background:var(--accent);
    color:#fdf8ec;
    font-family:'JetBrains Mono',monospace;
    font-size:14px;
    font-weight:700;
    display:flex; align-items:center; justify-content:center;
  }
  .pick-card .pick-info{ flex:1; min-width:0; }
  .pick-card .pick-name{
    font-size:15.5px;
    font-weight:600;
    color:var(--text);
    line-height:1.15;
  }
  .pick-card .pick-label{
    display:inline-block;
    font-family:'JetBrains Mono',monospace;
    font-size:10px;
    font-weight:700;
    letter-spacing:.03em;
    color:var(--accent);
    background:rgba(232,178,77,.14);
    border:1px solid var(--accent);
    border-radius:5px;
    padding:1px 6px;
    margin-bottom:3px;
  }
  .pick-card .pick-detail{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:var(--text-dim);
    margin-top:2px;
  }
  .pick-card .pick-chute{
    flex:none;
    font-family:'JetBrains Mono',monospace;
    font-variant-numeric:tabular-nums;
    font-weight:700;
    font-size:16px;
    color:var(--success);
    text-align:right;
  }
  .table-head{
    display:grid;
    grid-template-columns: 1fr 60px;
    gap:8px;
    align-items:center;
    padding:0 12px 6px;
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:.08em;
    color:var(--text-dim);
    font-weight:700;
  }
  .table-head span:last-child{ text-align:right; white-space:nowrap; }

  #rows{
    display:flex;
    flex-direction:column;
    gap:6px;
    position:relative;
  }
  .row{
    position:relative;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:9px;
    padding:9px 12px;
    box-sizing:border-box;
    transition: transform .35s ease, background-color .4s ease;
  }
  .row.row-hidden{ display:none; }
  .row.flash-up{ background:var(--success-bg); }
  .row.flash-down{ background:var(--danger-bg); }

  /* Un seul signal visuel fort par course : le cheval ayant subi la PLUS
     GROSSE chute de cote (% Chute, écart T1 -> Live), marquage définitif
     (reste visible ensuite quoi qu'il arrive à sa cote). Le snapshot T1, le
     délai d'évaluation du signal et la restriction de plage de cote
     dépendent du type de course (Trot Attelé/Monté : snapshot au départ
     (T0), évaluation à T0+30s, plage de cote live 1-10 ; Plat/Obstacle/
     Haie/Steeple-chase : snapshot 30s avant le départ, évaluation à T+2min,
     aucune restriction de plage) — cf. server.py. */
  .row.row-valuebet{
    border:2px solid var(--tote-fg);
    background:linear-gradient(0deg, rgba(232,178,77,.12), rgba(232,178,77,.12)), var(--surface);
    box-shadow:0 0 0 3px rgba(232,178,77,.16);
  }
  .valuebet-tag{
    position:absolute;
    top:-10px; left:10px;
    background:var(--tote-bg);
    color:var(--tote-fg);
    font-family:'JetBrains Mono',monospace;
    font-size:9.5px;
    font-weight:700;
    letter-spacing:.06em;
    text-transform:uppercase;
    padding:3px 8px;
    border-radius:20px;
    display:none;
  }
  .row.row-valuebet .valuebet-tag{ display:inline-block; }

  .row-top{
    display:flex;
    align-items:center;
    gap:9px;
  }
  .horse{
    display:flex;
    align-items:center;
    gap:9px;
    flex:1;
    min-width:0;
  }
  .num-badge{
    flex:none;
    width:27px; height:27px;
    border-radius:50%;
    background:var(--accent);
    color:#fdf8ec;
    font-family:'JetBrains Mono',monospace;
    font-size:13px;
    font-weight:700;
    display:flex; align-items:center; justify-content:center;
  }
  .horse-name{
    flex:1;
    min-width:0;
    font-size:15.5px;
    font-weight:600;
    color:var(--text);
    white-space:normal;
    line-height:1.15;
  }
  .fav-rank{
    font-style:italic;
    font-weight:400;
    font-size:11.5px;
    color:var(--text-dim);
    margin-left:5px;
  }
  .late-badge{ flex:none; font-size:12px; margin-left:2px; }
  .row-late{ border-style:dashed; }
  .cote{
    flex:none;
    font-family:'JetBrains Mono',monospace;
    font-variant-numeric:tabular-nums;
    font-weight:700;
    font-size:15px;
    color:var(--accent);
    text-align:right;
    min-width:44px;
  }

  .row-bottom{
    display:flex;
    align-items:center;
    gap:10px;
    margin:5px 0 0 33px;
    font-family:'JetBrains Mono',monospace;
    font-variant-numeric:tabular-nums;
    font-size:11.5px;
  }
  .stat{ display:flex; align-items:center; gap:3px; }
  .stat .lbl{ text-transform:uppercase; font-size:9px; letter-spacing:.06em; color:var(--text-dim); opacity:.7; }
  .var, .vitesse{ font-weight:700; }
  .var.up, .vitesse.up{ color:var(--success); }
  .var.down, .vitesse.down{ color:var(--danger); }
  .var.flat, .vitesse.flat{ color:var(--text-dim); }
  .stat-dot{ width:3px; height:3px; border-radius:50%; background:var(--border); }

  .empty{
    text-align:center;
    color:var(--text-dim);
    font-size:13px;
    padding:30px 10px;
  }
</style>
</head>
<body>
<div class="page">

  <div class="brand-title">🐎 TBlaugrana Turf 🐎</div>

  <div class="card" id="selectionCard">
    <div class="field">
      <label>Course suivie</label>
      <div id="courseInfo" class="course-info">Chargement…</div>
    </div>
  </div>

  <div class="tote">
    <div class="tote-clock" id="countdown">--:--</div>
    <div class="tote-label-row">
      <div class="tote-label" id="toteLabel"></div>
      <div class="discipline-badge" id="disciplineBadge"></div>
    </div>
  </div>
  <div class="snap-line" id="snapLine" style="display:none;">📸 Snapshot : en attente</div>
  <div class="status-line" id="statusLine"></div>

  <div class="table-wrap">
    <div class="strategy-section">
      <div class="strategy-title">
        🏆 Stratégie Gagnante
        <span class="discipline-tag" id="disciplineTagGagnant" style="display:none;"></span>
      </div>
      <div class="strategy-body" id="strategyGagnantBody">
        <div class="empty">En attente des critères de sélection…</div>
      </div>
    </div>
    <div class="strategy-section">
      <div class="strategy-title">
        🎯 Stratégie Placé
        <span class="discipline-tag" id="disciplineTagPlace" style="display:none;"></span>
      </div>
      <div class="strategy-body" id="strategyPlaceBody">
        <div class="empty">En attente des critères de sélection…</div>
      </div>
    </div>
  </div>

</div>

<script>
// -----------------------------------------------------------------------
// Client "léger" : tout le suivi (programme, cotes, historique, vitesse,
// top 5) est calculé côté serveur (server.py), en continu, indépendamment
// du fait qu'un onglet soit ouvert ou non. Cette page se contente d'interroger
// périodiquement /api/state et d'afficher ce que le serveur renvoie.
// -> Fermer l'onglet ne fait donc plus perdre aucune donnée : au retour,
//    le serveur renvoie l'état à jour (course en cours, cotes, historique).
// -----------------------------------------------------------------------
const POLL_INTERVAL_MS = 700;   // rythme de rafraîchissement de l'affichage (le serveur, lui, interroge PMU toutes les 500ms)
const FETCH_TIMEOUT_MS = 5000;

const courseInfoEl = document.getElementById('courseInfo');
const countdownEl = document.getElementById('countdown');
const snapLineEl = document.getElementById('snapLine');
const statusLineEl = document.getElementById('statusLine');
const toteLabelEl = document.getElementById('toteLabel');
const disciplineBadgeEl = document.getElementById('disciplineBadge');
const disciplineTagGagnantEl = document.getElementById('disciplineTagGagnant');
const disciplineTagPlaceEl = document.getElementById('disciplineTagPlace');
const strategyGagnantBodyEl = document.getElementById('strategyGagnantBody');
const strategyPlaceBodyEl = document.getElementById('strategyPlaceBody');

let rowEls = {};        // num -> élément DOM de la ligne (réutilisé d'un cycle à l'autre, pour un usage futur)
let lastGagnant = {};   // num -> dernière cote Gagnant affichée (pour détecter les variations et flasher, usage futur)
let departTs = null;
let pollTimer = null;
let lastRows = [];      // dernier data.rows reçu du serveur, conservé tel quel pour brancher les futurs critères de sélection Gagnant/Placé

// -----------------------------------------------------------------------
// Détection de la discipline (Plat / Trot / Haie) à partir du toteLabel déjà
// renvoyé par le serveur (qui commence par le champ "discipline" brut de
// l'API PMU, ex: "PLAT", "ATTELE", "MONTE", "HAIE", "STEEPLE-CHASE",
// "CROSS"...). Purement côté affichage : ne touche à aucun calcul de cote
// ni à la sélection de course côté serveur.
//   - TROT : Attelé + Monté
//   - HAIE : Haie + Steeple-chase + Cross
//   - PLAT : tout le reste (Plat, et fallback par défaut)
// -----------------------------------------------------------------------
function detectDiscipline(toteLabel){
  const label = (toteLabel || '').trim().toUpperCase();
  if(!label) return null;
  if(label.startsWith('TROT') || label.startsWith('ATTELE') || label.startsWith('MONTE')){
    return 'TROT';
  }
  if(label.startsWith('HAIE') || label.startsWith('STEEPLE') || label.startsWith('CROSS')){
    return 'HAIE';
  }
  return 'PLAT';
}

function disciplineLabel(code){
  if(code === 'TROT') return 'Trot';
  if(code === 'HAIE') return 'Haie';
  if(code === 'PLAT') return 'Plat';
  return '';
}

function updateDisciplineDisplay(toteLabel){
  const code = detectDiscipline(toteLabel);
  const label = disciplineLabel(code);
  if(label){
    disciplineBadgeEl.textContent = label;
    disciplineBadgeEl.classList.add('show');
    disciplineTagGagnantEl.textContent = label;
    disciplineTagGagnantEl.style.display = '';
    disciplineTagPlaceEl.textContent = label;
    disciplineTagPlaceEl.style.display = '';
  } else {
    disciplineBadgeEl.classList.remove('show');
    disciplineTagGagnantEl.style.display = 'none';
    disciplineTagPlaceEl.style.display = 'none';
  }
  return code;
}

function fmtCountdown(secs){
  if(secs >= 0){
    const h = Math.floor(secs/3600);
    const m = Math.floor((secs%3600)/60);
    const s = secs%60;
    if(h > 0) return `${h}h${String(m).padStart(2,'0')}`;
    return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  } else {
    const elapsed = Math.abs(secs);
    const m = Math.floor(elapsed/60);
    const s = elapsed%60;
    return `Partie ${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  }
}

function tickCountdown(){
  if(departTs !== null){
    const secs = Math.floor(departTs - (Date.now()/1000));
    countdownEl.textContent = fmtCountdown(secs);
  }
}

function buildRow(num){
  const row = document.createElement('div');
  row.className = 'row';
  row.dataset.num = num;
  row.innerHTML = `
    <span class="valuebet-tag">🔥⚡ VALUEBET ⚡ 🔥</span>
    <div class="row-top">
      <div class="horse">
        <span class="num-badge"></span>
        <span class="horse-name"><span class="name-text"></span><span class="fav-rank"></span></span>
      </div>
      <div class="cote"></div>
    </div>
    <div class="row-bottom">
      <span class="stat"><span class="lbl">T1</span><span class="var flat">—</span></span>
      <span class="stat-dot"></span>
      <span class="stat"><span class="lbl">Live</span><span class="vitesse flat">—</span></span>
    </div>
  `;
  row.querySelector('.num-badge').textContent = num;
  return row;
}

function rangFavori(rang){
  if(rang === 1) return '1er favori';
  return `${rang}e favori`;
}

// NOTE : le calcul des cotes, du % de chute, de la vitesse, du valuebet,
// etc. continue de tourner exactement comme avant côté serveur (server.py,
// non modifié) et arrive toujours dans data.rows à chaque poll. On garde
// ces données en mémoire (lastRows) pour pouvoir brancher les critères de
// sélection Gagnant/Placé dès qu'ils seront définis. En attendant, les 2
// sections affichent juste un message d'attente (aucun tableau de cotes
// affiché pour le moment, comme demandé).
function renderTable(rows){
  lastRows = rows || [];
  // La sélection Gagnant/Placé (1 ou plusieurs chevaux par course, selon la
  // discipline détectée) est calculée côté serveur -- cf. renderPick(),
  // alimentée par data.strategyGagnant / data.strategyPlace.
}

// Affiche le(s) cheval(aux) retenu(s) par une strategie (venant de
// data.strategyGagnant / data.strategyPlace, calcules cote serveur -- cf.
// compute_strategy_picks dans server.py) dans le conteneur donne. Le
// serveur renvoie desormais toujours une LISTE (potentiellement vide, ou
// null si la fenetre n'est pas encore terminee) : la plupart des strategies
// ne contiennent qu'un seul element (le meilleur), certaines (cf. "multi"
// cote serveur, ex: PLAT Gagnant) peuvent en contenir plusieurs -> on les
// affiche alors empiles, un pick-card par cheval.
function pickCardHtml(pick){
  const coteFinStr = (pick.coteFin !== null && pick.coteFin !== undefined) ? pick.coteFin.toFixed(1) : '—';
  const coteDebutStr = (pick.coteDebut !== null && pick.coteDebut !== undefined) ? pick.coteDebut.toFixed(1) : '—';
  const pctStr = (pick.pctChute !== null && pick.pctChute !== undefined) ? `-${pick.pctChute.toFixed(1)}%` : '—';
  // pick.label : present pour le Placé PLAT, TROT et HAIE (chacun decoupe
  // en plusieurs sous-stratégies "Place 1" / "Place 2" / ... indépendantes
  // et live, cf. STRATEGY_CONFIG dans server.py). Absent (undefined) pour
  // la strategie Gagnant -> pas de badge affiché dans ce cas.
  const labelHtml = pick.label ? `<div class="pick-label">${pick.label}</div>` : '';
  return `
    <div class="pick-card">
      <span class="num-badge">${pick.num}</span>
      <div class="pick-info">
        ${labelHtml}
        <div class="pick-name">${pick.nom || `#${pick.num}`}</div>
        <div class="pick-detail">Cote ${coteDebutStr} → ${coteFinStr}</div>
      </div>
      <div class="pick-chute">${pctStr}</div>
    </div>
  `;
}

function renderPick(containerEl, picks){
  if(!picks || picks.length === 0){
    containerEl.innerHTML = '<div class="empty">Aucun cheval ne correspond au critère pour le moment.</div>';
    return;
  }
  containerEl.innerHTML = picks.map(pickCardHtml).join('');
}

function applyState(data){
  courseInfoEl.textContent = data.courseInfo || 'Chargement…';
  departTs = data.departTs;
  toteLabelEl.textContent = data.toteLabel || '';
  updateDisciplineDisplay(data.toteLabel);

  if(data.snapLine){
    snapLineEl.textContent = data.snapLine;
    snapLineEl.style.display = '';
  } else {
    snapLineEl.style.display = 'none';
  }

  if(data.statusLine){
    statusLineEl.textContent = data.statusLine;
    statusLineEl.style.color = data.statusLine.startsWith('Erreur') ? 'var(--danger)' : 'var(--text-dim)';
  } else {
    statusLineEl.textContent = '';
  }

  renderTable(data.rows);
  renderPick(strategyGagnantBodyEl, data.strategyGagnant);
  renderPick(strategyPlaceBodyEl, data.strategyPlace);
}

async function pollState(){
  const controller = new AbortController();
  const killer = setTimeout(()=>controller.abort(), FETCH_TIMEOUT_MS);
  try{
    const res = await fetch('/api/state', { signal: controller.signal, cache: "no-store" });
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    applyState(data);
  }catch(e){
    if(e.name !== "AbortError"){
      statusLineEl.textContent = `Connexion au serveur perdue, nouvelle tentative… (${e.message})`;
      statusLineEl.style.color = "var(--danger)";
    }
  }finally{
    clearTimeout(killer);
    pollTimer = setTimeout(pollState, POLL_INTERVAL_MS);
  }
}

setInterval(tickCountdown, 500);
pollState();
</script>
