<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TBlaugrana Rang</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f3efe3;
    --surface:#fffdf8;
    --surface-alt:#ece4d0;
    --border:#ddd3b8;
    --text:#1f2a22;
    --text-dim:#7d7460;
    --accent:#1f3d2c;
    --accent-2:#8b5e34;
    --success:#2f7a4f;
    --success-bg:#e4efe6;
    --danger:#b23a2e;
    --danger-bg:#f6e6e2;
    --tote-bg:#14201a;
    --tote-fg:#e8b24d;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
  }
  .page{
    max-width:600px;
    margin:0 auto;
    min-height:100vh;
    padding:8px 18px 14px;
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .eyebrow{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--accent-2);
    font-weight:500;
  }
  h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:30px;
    line-height:1.05;
    margin:4px 0 2px;
    color:var(--accent);
  }
  .subtitle{
    font-size:13px;
    color:var(--text-dim);
  }
  .subtitle b{ color:var(--text); font-weight:600; }

  .brand-title{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:32px;
    line-height:1;
    color:var(--accent);
    text-align:center;
    letter-spacing:.015em;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    margin:14px 0 22px;
  }

  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:16px 18px;
  }

  .btn-row-compact button{
    font-size:13px;
    padding:9px 10px;
  }

  .field{ margin-bottom:12px; }
  .field:last-child{ margin-bottom:0; }
  label{
    display:block;
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:.08em;
    color:var(--text-dim);
    margin-bottom:5px;
    font-weight:600;
  }
  select{
    width:100%;
    appearance:none;
    -webkit-appearance:none;
    background:var(--surface) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="%237d7460" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>') no-repeat right 14px center;
    border:1px solid var(--border);
    border-radius:10px;
    padding:12px 38px 12px 14px;
    font-family:'Inter',sans-serif;
    font-size:16px;
    color:var(--text);
  }
  select:focus{ outline:2px solid var(--accent); outline-offset:1px; }
  .course-info{
    width:100%;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:10px;
    padding:12px 14px;
    font-family:'Inter',sans-serif;
    font-size:16px;
    font-weight:600;
    color:var(--text);
  }
  select optgroup{
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-style:normal;
    color:var(--accent);
    background:var(--surface);
  }
  select option.opt-past{
    color:var(--text-dim);
  }

  .btn-row{ display:flex; gap:10px; margin-top:14px; }
  button{
    flex:1;
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--text);
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:15px;
    padding:13px 12px;
    border-radius:10px;
    cursor:pointer;
    transition:background .15s ease, transform .1s ease;
  }
  button:hover{ background:var(--surface-alt); }
  button:active{ transform:scale(.98); }
  button.primary{
    background:var(--accent);
    border-color:var(--accent);
    color:#fdf8ec;
  }
  button.primary:hover{ background:#163225; }
  button:disabled{
    opacity:.5;
    cursor:not-allowed;
    transform:none;
  }

  .tote{
    background:var(--tote-bg);
    border-radius:var(--radius);
    padding:10px 16px;
    text-align:center;
  }
  .tote-clock{
    font-family:'JetBrains Mono',monospace;
    font-variant-numeric:tabular-nums;
    font-size:26px;
    font-weight:700;
    color:var(--tote-fg);
    letter-spacing:.02em;
  }
  .tote-label{
    font-family:'JetBrains Mono',monospace;
    font-size:9px;
    text-transform:uppercase;
    letter-spacing:.14em;
    color:#9aa89a;
    margin-top:2px;
  }
  .snap-line{
    text-align:center;
    font-size:12px;
    color:var(--text-dim);
    margin-top:4px;
  }
  .status-line{
    text-align:center;
    font-size:11px;
    color:var(--danger);
    min-height:0;
    margin-top:2px;
  }

  .table-wrap{ flex:1; }
  .table-head{
    display:grid;
    grid-template-columns: 1fr 52px;
    gap:8px;
    align-items:center;
    padding:0 12px 6px;
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:.08em;
    color:var(--text-dim);
    font-weight:700;
  }
  .table-head span:last-child{ text-align:right; }

  #rows{
    display:flex;
    flex-direction:column;
    gap:6px;
    position:relative;
  }
  .row{
    position:relative;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:9px;
    padding:9px 12px;
    box-sizing:border-box;
    transition: transform .35s ease, background-color .4s ease;
  }
  .row.row-hidden{ display:none; }
  .row.flash-up{ background:var(--success-bg); }
  .row.flash-down{ background:var(--danger-bg); }

  /* Un seul signal visuel fort, réservé au cas où 🔥 gros écart ET
     ⚡ mouvement rapide sont vrais EN MÊME TEMPS sur le même cheval.
     Rien n'est affiché si un seul des deux critères est rempli. */
  .row.row-valuebet{
    border:2px solid var(--tote-fg);
    background:linear-gradient(0deg, rgba(232,178,77,.12), rgba(232,178,77,.12)), var(--surface);
    box-shadow:0 0 0 3px rgba(232,178,77,.16);
  }
  .valuebet-tag{
    position:absolute;
    top:-10px; left:10px;
    background:var(--tote-bg);
    color:var(--tote-fg);
    font-family:'JetBrains Mono',monospace;
    font-size:9.5px;
    font-weight:700;
    letter-spacing:.06em;
    text-transform:uppercase;
    padding:3px 8px;
    border-radius:20px;
    display:none;
  }
  .row.row-valuebet .valuebet-tag{ display:inline-block; }

  .row-top{
    display:flex;
    align-items:center;
    gap:9px;
  }
  .horse{
    display:flex;
    align-items:center;
    gap:9px;
    flex:1;
    min-width:0;
  }
  .num-badge{
    flex:none;
    width:27px; height:27px;
    border-radius:50%;
    background:var(--accent);
    color:#fdf8ec;
    font-family:'JetBrains Mono',monospace;
    font-size:13px;
    font-weight:700;
    display:flex; align-items:center; justify-content:center;
  }
  .horse-name{
    flex:1;
    min-width:0;
    font-size:15.5px;
    font-weight:600;
    color:var(--text);
    white-space:normal;
    line-height:1.15;
  }
  .fav-rank{
    font-style:italic;
    font-weight:400;
    font-size:11.5px;
    color:var(--text-dim);
    margin-left:5px;
  }
  .late-badge{ flex:none; font-size:12px; margin-left:2px; }
  .row-late{ border-style:dashed; }
  .cote{
    flex:none;
    font-family:'JetBrains Mono',monospace;
    font-variant-numeric:tabular-nums;
    font-weight:700;
    font-size:15px;
    color:var(--accent);
    text-align:right;
    min-width:44px;
  }

  .row-bottom{
    display:flex;
    align-items:center;
    gap:10px;
    margin:5px 0 0 33px;
    font-family:'JetBrains Mono',monospace;
    font-variant-numeric:tabular-nums;
    font-size:11.5px;
  }
  .stat{ display:flex; align-items:center; gap:3px; }
  .stat .lbl{ text-transform:uppercase; font-size:9px; letter-spacing:.06em; color:var(--text-dim); opacity:.7; }
  .var, .vitesse{ font-weight:700; }
  .var.up, .vitesse.up{ color:var(--success); }
  .var.down, .vitesse.down{ color:var(--danger); }
  .var.flat, .vitesse.flat{ color:var(--text-dim); }
  .stat-dot{ width:3px; height:3px; border-radius:50%; background:var(--border); }

  .empty{
    text-align:center;
    color:var(--text-dim);
    font-size:13px;
    padding:30px 10px;
  }
</style>
</head>
<body>
<div class="page">

  <div class="brand-title">🐎 TBlaugrana Rang 🐎</div>

  <div class="card" id="selectionCard">
    <div class="field">
      <label>Course suivie</label>
      <div id="courseInfo" class="course-info">Chargement…</div>
    </div>
  </div>

  <div class="tote">
    <div class="tote-clock" id="countdown">--:--</div>
    <div class="tote-label" id="toteLabel"></div>
  </div>
  <div class="snap-line" id="snapLine" style="display:none;">📸 Snapshot : en attente</div>
  <div class="status-line" id="statusLine"></div>

  <div class="table-wrap">
    <div class="table-head">
      <span>Cheval</span>
      <span>Cité G</span>
    </div>
    <div id="rows"><div class="empty">Chargement de la course en cours…</div></div>
  </div>

</div>

<script>
// -----------------------------------------------------------------------
// Client "léger" : tout le suivi (programme, cotes, historique, vitesse,
// top 5) est calculé côté serveur (server.py), en continu, indépendamment
// du fait qu'un onglet soit ouvert ou non. Cette page se contente d'interroger
// périodiquement /api/state et d'afficher ce que le serveur renvoie.
// -> Fermer l'onglet ne fait donc plus perdre aucune donnée : au retour,
//    le serveur renvoie l'état à jour (course en cours, cotes, historique).
// -----------------------------------------------------------------------
const POLL_INTERVAL_MS = 700;   // rythme de rafraîchissement de l'affichage (le serveur, lui, interroge PMU toutes les 500ms)
const FETCH_TIMEOUT_MS = 5000;

const courseInfoEl = document.getElementById('courseInfo');
const countdownEl = document.getElementById('countdown');
const snapLineEl = document.getElementById('snapLine');
const statusLineEl = document.getElementById('statusLine');
const toteLabelEl = document.getElementById('toteLabel');
const rowsEl = document.getElementById('rows');

let rowEls = {};        // num -> élément DOM de la ligne (réutilisé d'un cycle à l'autre)
let lastGagnant = {};   // num -> dernière cote Gagnant affichée (pour détecter les variations et flasher)
let departTs = null;
let pollTimer = null;

function fmtCountdown(secs){
  if(secs >= 0){
    const h = Math.floor(secs/3600);
    const m = Math.floor((secs%3600)/60);
    const s = secs%60;
    if(h > 0) return `${h}h${String(m).padStart(2,'0')}`;
    return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  } else {
    const elapsed = Math.abs(secs);
    const m = Math.floor(elapsed/60);
    const s = elapsed%60;
    return `Partie ${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  }
}

function tickCountdown(){
  if(departTs !== null){
    const secs = Math.floor(departTs - (Date.now()/1000));
    countdownEl.textContent = fmtCountdown(secs);
  }
}

function buildRow(num){
  const row = document.createElement('div');
  row.className = 'row';
  row.dataset.num = num;
  row.innerHTML = `
    <span class="valuebet-tag">🔥⚡ VALUEBET ⚡ 🔥</span>
    <div class="row-top">
      <div class="horse">
        <span class="num-badge"></span>
        <span class="horse-name"><span class="name-text"></span><span class="fav-rank"></span></span>
      </div>
      <div class="cote"></div>
    </div>
    <div class="row-bottom">
      <span class="stat"><span class="lbl">Δ</span><span class="var flat">—</span></span>
      <span class="stat-dot"></span>
      <span class="stat"><span class="lbl">Vit.</span><span class="vitesse flat">—</span></span>
    </div>
  `;
  row.querySelector('.num-badge').textContent = num;
  return row;
}

function rangFavori(rang){
  if(rang === 1) return '1er favori';
  return `${rang}e favori`;
}

function renderTable(rows){
  const emptyMsg = rowsEl.querySelector('.empty');
  if(!rows || rows.length === 0){
    if(!emptyMsg) rowsEl.innerHTML = '<div class="empty">Aucun cheval avec une cote disponible pour le moment.</div>';
    return;
  }
  if(emptyMsg) emptyMsg.remove();

  const prevRects = {};
  for(const num in rowEls){
    prevRects[num] = rowEls[num].getBoundingClientRect();
  }

  // Rang au favoritisme : classement de tous les partants par cote (probabilité
  // implicite) décroissante, indépendant de l'ordre d'affichage des lignes
  // (qui reste par numéro de cheval). Les chevaux sans cote disponible n'ont
  // pas de rang.
  const rangParNum = {};
  rows
    .filter(r => r.coteG !== null && r.coteG !== undefined)
    .sort((a, b) => b.coteG - a.coteG)
    .forEach((r, i) => { rangParNum[r.num] = i + 1; });

  rows.forEach(r=>{
    const num = r.num;
    const nom = r.nom || `#${num}`;
    const coteG = (r.coteG === null || r.coteG === undefined) ? undefined : r.coteG;
    const delta15 = (r.delta15 === null || r.delta15 === undefined) ? undefined : r.delta15;

    const coteGStr = coteG !== undefined ? `${coteG.toFixed(1)}%` : "—";
    const delta15Str = delta15 !== undefined ? `${delta15 >= 0 ? '+' : ''}${delta15.toFixed(1)}%` : "—";

    let row = rowEls[num];
    if(!row){
      row = buildRow(num);
      rowEls[num] = row;
    }

    const nameTextEl = row.querySelector('.name-text');
    if(nameTextEl.textContent !== nom) nameTextEl.textContent = nom;

    const rangEl = row.querySelector('.fav-rank');
    const rang = rangParNum[num];
    const rangStr = rang ? rangFavori(rang) : '';
    if(rangEl.textContent !== rangStr) rangEl.textContent = rangStr;

    const coteEl = row.querySelector('.cote');
    if(coteEl.textContent !== coteGStr){
      coteEl.textContent = coteGStr;
      const prevC = lastGagnant[num];
      if(prevC !== undefined && coteG !== undefined && coteG !== prevC){
        row.classList.remove('flash-up','flash-down');
        void row.offsetWidth;
        row.classList.add(coteG < prevC ? 'flash-up' : 'flash-down');
        clearTimeout(row._flashTimer);
        row._flashTimer = setTimeout(()=>row.classList.remove('flash-up','flash-down'), 500);
      }
    }
    if(coteG !== undefined) lastGagnant[num] = coteG;

    const deltaEl = row.querySelector('.var');
    if(deltaEl.textContent !== delta15Str) deltaEl.textContent = delta15Str;
    deltaEl.classList.remove('up','down','flat');
    if(delta15 === undefined) deltaEl.classList.add('flat');
    else if(delta15 > 0) deltaEl.classList.add('up');
    else if(delta15 < 0) deltaEl.classList.add('down');
    else deltaEl.classList.add('flat');

    const spd = (r.speed === null || r.speed === undefined) ? undefined : r.speed;
    const isFast = !!r.isFast;
    const vitesseEl = row.querySelector('.vitesse');
    if(vitesseEl){
      const vitesseStr = spd !== undefined ? `${spd >= 0 ? '+' : ''}${spd.toFixed(1)}%` : "—";
      if(vitesseEl.textContent !== vitesseStr) vitesseEl.textContent = vitesseStr;
      vitesseEl.classList.remove('up','down','flat');
      if(spd === undefined) vitesseEl.classList.add('flat');
      else if(spd > 0) vitesseEl.classList.add('up');
      else if(spd < 0) vitesseEl.classList.add('down');
      else vitesseEl.classList.add('flat');
      vitesseEl.title = isFast
        ? `⚡ Mouvement rapide : ${spd > 0 ? '+' : ''}${spd.toFixed(1)} %/min (variation relative de la probabilité implicite lissée, fenêtre ≤45s)`
        : `Vitesse de variation relative : ${spd !== undefined ? (spd >= 0 ? '+' : '') + spd.toFixed(1) : '—'} %/min (probabilité implicite lissée, fenêtre ≤45s)`;
    }

    // Signal "VALUEBET" : ne s'affiche QUE quand les deux critères sont
    // vrais EN MÊME TEMPS sur le même cheval — 🔥 gros écart (Δ15s ≥ seuil,
    // marqué à vie pour la course) ET ⚡ mouvement rapide (vitesse ≥ seuil,
    // état du moment). Un seul des deux critères rempli ne déclenche plus
    // aucune décoration ; le texte Δ15s/Vitesse reste simplement coloré.
    const delta120 = (r.delta120 === null || r.delta120 === undefined) ? undefined : r.delta120;
    const isBigMove = !!r.isBigMove;
    const isValuebet = isBigMove && isFast;
    const valuebetEl = row.querySelector('.valuebet-tag');
    if(valuebetEl && isValuebet){
      const deltaTxt = delta120 !== undefined ? `${delta120 >= 0 ? '+' : ''}${delta120.toFixed(1)}%` : '—';
      const spdTxt = spd !== undefined ? `${spd >= 0 ? '+' : ''}${spd.toFixed(1)}%/min` : '—';
      valuebetEl.title = `Gros écart (${deltaTxt}) + mouvement rapide (${spdTxt}) en même temps`;
    }
    row.classList.toggle('row-valuebet', isValuebet);

    // ne montre que les GAINERS_TOP_N chevaux (6) avec la plus forte progression
    // de part de marché (Gagnant) sur les 15 dernières secondes ; un cheval qui
    // sort du classement est simplement masqué (pas supprimé) donc il réapparaît
    // instantanément dès qu'il y revient — calcul fait côté serveur, en continu
    row.classList.toggle('row-hidden', !!r.hidden);

    rowsEl.appendChild(row);
  });

  const presentNums = new Set(rows.map(r=>r.num));
  for(const num in rowEls){
    if(!presentNums.has(num)){
      rowEls[num].remove();
      delete rowEls[num];
    }
  }


  rowsEl.querySelectorAll('.row:not(.row-hidden)').forEach(el=>{
    const prev = prevRects[el.dataset.num];
    if(prev){
      const next = el.getBoundingClientRect();
      const dy = prev.top - next.top;
      if(dy !== 0){
        el.style.transition = "none";
        el.style.transform = `translateY(${dy}px)`;
        requestAnimationFrame(()=>{
          el.style.transition = "transform .35s ease, background-color .4s ease";
          el.style.transform = "translateY(0)";
        });
      }
    }
  });
}

function applyState(data){
  courseInfoEl.textContent = data.courseInfo || 'Chargement…';
  departTs = data.departTs;
  toteLabelEl.textContent = data.toteLabel || '';

  if(data.snapLine){
    snapLineEl.textContent = data.snapLine;
  }
  snapLineEl.style.display = 'none';

  if(data.statusLine){
    statusLineEl.textContent = data.statusLine;
    statusLineEl.style.color = data.statusLine.startsWith('Erreur') ? 'var(--danger)' : 'var(--text-dim)';
  } else {
    statusLineEl.textContent = '';
  }

  renderTable(data.rows);
}

async function pollState(){
  const controller = new AbortController();
  const killer = setTimeout(()=>controller.abort(), FETCH_TIMEOUT_MS);
  try{
    const res = await fetch('/api/state', { signal: controller.signal, cache: "no-store" });
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    applyState(data);
  }catch(e){
    if(e.name !== "AbortError"){
      statusLineEl.textContent = `Connexion au serveur perdue, nouvelle tentative… (${e.message})`;
      statusLineEl.style.color = "var(--danger)";
    }
  }finally{
    clearTimeout(killer);
    pollTimer = setTimeout(pollState, POLL_INTERVAL_MS);
  }
}

setInterval(tickCountdown, 500);
pollState();
</script>
</body>
</html>
