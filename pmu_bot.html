<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TBlaugrana Rang</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f3efe3;
    --surface:#fffdf8;
    --surface-alt:#ece4d0;
    --border:#ddd3b8;
    --text:#1f2a22;
    --text-dim:#7d7460;
    --accent:#1f3d2c;
    --accent-2:#8b5e34;
    --success:#2f7a4f;
    --success-bg:#e4efe6;
    --danger:#b23a2e;
    --danger-bg:#f6e6e2;
    --tote-bg:#14201a;
    --tote-fg:#e8b24d;
    --silver:#c7ccd4;
    --bronze:#c9955f;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
  }
  .page{
    max-width:600px;
    margin:0 auto;
    min-height:100vh;
    padding:8px 18px 14px;
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .eyebrow{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--accent-2);
    font-weight:500;
  }
  .subtitle{
    font-size:13px;
    color:var(--text-dim);
  }
  .subtitle b{ color:var(--text); font-weight:600; }

  .brand-title{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:32px;
    line-height:1;
    color:var(--accent);
    text-align:center;
    letter-spacing:.015em;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    margin:14px 0 22px;
  }

  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:16px 18px;
  }

  .field{ margin-bottom:12px; }
  .field:last-child{ margin-bottom:0; }
  label{
    display:block;
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:.08em;
    color:var(--text-dim);
    margin-bottom:5px;
    font-weight:600;
  }
  .course-info{
    width:100%;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:10px;
    padding:12px 14px;
    font-family:'Inter',sans-serif;
    font-size:16px;
    font-weight:600;
    color:var(--text);
  }

  .tote{
    background:var(--tote-bg);
    border-radius:var(--radius);
    padding:10px 16px;
    text-align:center;
  }
  .tote-clock{
    font-family:'JetBrains Mono',monospace;
    font-variant-numeric:tabular-nums;
    font-size:26px;
    font-weight:700;
    color:var(--tote-fg);
    letter-spacing:.02em;
  }
  .tote-label{
    font-family:'JetBrains Mono',monospace;
    font-size:9px;
    text-transform:uppercase;
    letter-spacing:.14em;
    color:#9aa89a;
    margin-top:2px;
  }
  .snap-line{
    text-align:center;
    font-size:12px;
    color:var(--text-dim);
    margin-top:4px;
  }
  .status-line{
    text-align:center;
    font-size:11px;
    color:var(--danger);
    min-height:0;
    margin-top:2px;
  }

  /* ---------------------------------------------------------------------
     Classement Top 5 : contrairement a l'ancien tableau (qui reordonnait
     physiquement toutes les lignes a chaque cycle, donnant une impression
     de chaos visuel), ici il y a EXACTEMENT 5 emplacements fixes (1 a 5).
     Seul le CONTENU d'un emplacement change quand un cheval en sort ou y
     entre (fondu), la position #1/#2/.../#5 elle-meme ne bouge jamais a
     l'ecran.
     --------------------------------------------------------------------- */
  .board-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    padding:2px 4px 4px;
  }
  .board-head .eyebrow{ margin:0; }
  .board-head .board-sub{
    font-size:10.5px;
    color:var(--text-dim);
    font-family:'JetBrains Mono',monospace;
  }

  #board{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .slot{
    position:relative;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:11px;
    padding:10px 13px;
    display:flex;
    align-items:center;
    gap:12px;
    min-height:56px;
    transition: background-color .4s ease, border-color .3s ease;
  }
  .slot.slot-empty{
    justify-content:center;
    color:var(--text-dim);
    font-size:12.5px;
  }
  .slot.flash-up{ background:var(--success-bg); }
  .slot.flash-down{ background:var(--danger-bg); }

  .slot-rank{
    flex:none;
    width:34px; height:34px;
    border-radius:50%;
    background:var(--surface-alt);
    border:2px solid var(--border);
    color:var(--accent);
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:16px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .slot-rank.rank-1{ background:var(--tote-fg); border-color:var(--tote-fg); color:var(--tote-bg); }
  .slot-rank.rank-2{ background:var(--silver); border-color:#adb3bd; color:#2b2f36; }
  .slot-rank.rank-3{ background:var(--bronze); border-color:#a9743f; color:#3d2510; }

  .slot-body{ flex:1; min-width:0; transition:opacity .25s ease; }
  .slot-body.swap{ opacity:0; }

  .slot-top{
    display:flex;
    align-items:center;
    gap:9px;
  }
  .horse{
    display:flex;
    align-items:center;
    gap:9px;
    flex:1;
    min-width:0;
  }
  .num-badge{
    flex:none;
    width:24px; height:24px;
    border-radius:50%;
    background:var(--accent);
    color:#fdf8ec;
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    font-weight:700;
    display:flex; align-items:center; justify-content:center;
  }
  .horse-name{
    flex:1;
    min-width:0;
    font-size:15px;
    font-weight:600;
    color:var(--text);
    white-space:normal;
    line-height:1.15;
  }
  .fav-rank{
    font-style:italic;
    font-weight:400;
    font-size:11px;
    color:var(--text-dim);
    margin-left:5px;
  }
  .cote{
    flex:none;
    font-family:'JetBrains Mono',monospace;
    font-variant-numeric:tabular-nums;
    font-weight:700;
    font-size:15px;
    color:var(--accent);
    text-align:right;
    min-width:44px;
  }

  .slot-bottom{
    display:flex;
    align-items:center;
    gap:10px;
    margin:5px 0 0 33px;
    font-family:'JetBrains Mono',monospace;
    font-variant-numeric:tabular-nums;
    font-size:11.5px;
  }
  .stat{ display:flex; align-items:center; gap:3px; }
  .stat .lbl{ text-transform:uppercase; font-size:9px; letter-spacing:.06em; color:var(--text-dim); opacity:.7; }
  .var, .vitesse{ font-weight:700; }
  .var.up, .vitesse.up{ color:var(--success); }
  .var.down, .vitesse.down{ color:var(--danger); }
  .var.flat, .vitesse.flat{ color:var(--text-dim); }
  .stat-dot{ width:3px; height:3px; border-radius:50%; background:var(--border); }
  .record-age{
    margin-left:auto;
    font-size:9.5px;
    color:var(--text-dim);
    opacity:.75;
    font-style:italic;
  }
</style>
</head>
<body>
<div class="page">

  <div class="brand-title">🐎 TBlaugrana Rang 🐎</div>

  <div class="card" id="selectionCard">
    <div class="field">
      <label>Course suivie</label>
      <div id="courseInfo" class="course-info">Chargement…</div>
    </div>
  </div>

  <div class="tote">
    <div class="tote-clock" id="countdown">--:--</div>
    <div class="tote-label" id="toteLabel"></div>
  </div>
  <div class="snap-line" id="snapLine" style="display:none;">📸 Snapshot : en attente</div>
  <div class="status-line" id="statusLine"></div>

  <div class="board-head">
    <span class="eyebrow">Top 5 · plus gros écarts enregistrés</span>
    <span class="board-sub">figé jusqu'au départ, sauf nouveau record</span>
  </div>
  <div id="board"></div>

</div>

<script>
// -----------------------------------------------------------------------
// Client "léger" : tout le suivi (programme, cotes, historique, vitesse,
// classement) est calculé côté serveur (server.py), en continu,
// indépendamment du fait qu'un onglet soit ouvert ou non. Cette page se
// contente d'interroger périodiquement /api/state et d'afficher ce que le
// serveur renvoie.
//
// Le serveur renvoie deja "rows" TRIE par classement (plus forte
// progression de part de marche sur 15s), avec un flag "hidden" qui
// masque les tocards (cote < seuil) et tout ce qui sort du top N interne.
// Ici, on se contente de prendre les 5 premieres lignes NON masquees de
// cette liste deja triee, et de les afficher dans 5 emplacements FIXES
// (#1 a #5) : contrairement a l'ancien affichage, les emplacements ne se
// deplacent jamais a l'ecran, seul leur contenu change (avec un fondu)
// quand un cheval entre ou sort du top 5.
// -----------------------------------------------------------------------
const POLL_INTERVAL_MS = 700;   // rythme de rafraîchissement de l'affichage (le serveur, lui, interroge PMU toutes les 500ms)
const FETCH_TIMEOUT_MS = 5000;
const TOP_N = 5;

const courseInfoEl = document.getElementById('courseInfo');
const countdownEl = document.getElementById('countdown');
const snapLineEl = document.getElementById('snapLine');
const statusLineEl = document.getElementById('statusLine');
const toteLabelEl = document.getElementById('toteLabel');
const boardEl = document.getElementById('board');

let slotEls = [];       // 5 emplacements DOM fixes (rang -> element)
let lastGagnant = {};   // num -> dernière cote Gagnant affichée (pour détecter les variations et flasher)
let departTs = null;

function fmtCountdown(secs){
  if(secs >= 0){
    const h = Math.floor(secs/3600);
    const m = Math.floor((secs%3600)/60);
    const s = secs%60;
    if(h > 0) return `${h}h${String(m).padStart(2,'0')}`;
    return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  } else {
    const elapsed = Math.abs(secs);
    const m = Math.floor(elapsed/60);
    const s = elapsed%60;
    return `Partie ${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  }
}

function tickCountdown(){
  if(departTs !== null){
    const secs = Math.floor(departTs - (Date.now()/1000));
    countdownEl.textContent = fmtCountdown(secs);
  }
  // Rafraîchit uniquement le texte "figé il y a Xs" de chaque emplacement,
  // sans jamais toucher aux chiffres (Δ record / vitesse record) eux-mêmes.
  slotEls.forEach(slot=>{
    const ageEl = slot.querySelector('.record-age');
    if(!ageEl || !slot.dataset.recordAt) return;
    ageEl.textContent = fmtAge((Date.now()/1000) - Number(slot.dataset.recordAt));
  });
}

function buildSlot(rank){
  const slot = document.createElement('div');
  slot.className = 'slot';
  slot.dataset.rank = String(rank);
  slot.innerHTML = `
    <div class="slot-rank rank-${rank}">${rank}</div>
    <div class="slot-body">
      <div class="slot-top">
        <div class="horse">
          <span class="num-badge"></span>
          <span class="horse-name"><span class="name-text"></span><span class="fav-rank"></span></span>
        </div>
        <div class="cote"></div>
      </div>
      <div class="slot-bottom">
        <span class="stat"><span class="lbl">Δ record</span><span class="var flat">—</span></span>
        <span class="stat-dot"></span>
        <span class="stat"><span class="lbl">Vit. record</span><span class="vitesse flat">—</span></span>
        <span class="record-age"></span>
      </div>
    </div>
  `;
  boardEl.appendChild(slot);
  return slot;
}

function ensureSlots(){
  if(slotEls.length) return;
  for(let rank = 1; rank <= TOP_N; rank++){
    slotEls.push(buildSlot(rank));
  }
}

function rangFavori(rang){
  if(rang === 1) return '1er favori';
  return `${rang}e favori`;
}

function setSlotEmpty(slot){
  slot.classList.add('slot-empty');
  slot.classList.remove('flash-up','flash-down');
  slot.dataset.num = '';
  delete slot.dataset.recordAt;
  const body = slot.querySelector('.slot-body');
  if(body && !slot.querySelector('.empty-txt')){
    body.innerHTML = '<span class="empty-txt">En attente d\'un cheval…</span>';
  }
}

function fmtAge(secs){
  if(secs === undefined || secs === null || secs < 0) return '';
  if(secs < 60) return `figé il y a ${Math.floor(secs)}s`;
  const m = Math.floor(secs/60);
  return `figé il y a ${m}min`;
}

function fillSlot(slot, r){
  if(slot.classList.contains('slot-empty') || slot.querySelector('.empty-txt')){
    // reconstruit le contenu normal si l'emplacement etait vide juste avant
    slot.querySelector('.slot-body').innerHTML = `
      <div class="slot-top">
        <div class="horse">
          <span class="num-badge"></span>
          <span class="horse-name"><span class="name-text"></span><span class="fav-rank"></span></span>
        </div>
        <div class="cote"></div>
      </div>
      <div class="slot-bottom">
        <span class="stat"><span class="lbl">Δ record</span><span class="var flat">—</span></span>
        <span class="stat-dot"></span>
        <span class="stat"><span class="lbl">Vit. record</span><span class="vitesse flat">—</span></span>
        <span class="record-age"></span>
      </div>
    `;
  }
  slot.classList.remove('slot-empty');

  const num = r.num;
  const nom = r.nom || `#${num}`;
  // cote actuelle : reste live (purement informatif, ne pilote pas le classement)
  const coteG = (r.coteG === null || r.coteG === undefined) ? undefined : r.coteG;
  const coteGStr = coteG !== undefined ? `${coteG.toFixed(1)}%` : "—";

  // Δ et vitesse : valeurs ENREGISTRÉES (le plus gros écart détecté pendant
  // la dernière minute avant le départ). Elles ne changent QUE si un
  // mouvement encore plus grand est détecté pour ce cheval — jamais à
  // chaque cycle. C'est ce qui détermine le classement (positions 1 à 5).
  const deltaRecord = (r.deltaRecord === null || r.deltaRecord === undefined) ? undefined : r.deltaRecord;
  const speedRecord = (r.speedRecord === null || r.speedRecord === undefined) ? undefined : r.speedRecord;
  const deltaRecordStr = deltaRecord !== undefined ? `+${deltaRecord.toFixed(1)}%` : "—";
  const speedRecordStr = speedRecord !== undefined ? `${speedRecord >= 0 ? '+' : ''}${speedRecord.toFixed(1)}%/min` : "—";

  const changedHorse = slot.dataset.num !== num;
  slot.dataset.num = num;

  slot.querySelector('.num-badge').textContent = num;

  const nameTextEl = slot.querySelector('.name-text');
  if(nameTextEl.textContent !== nom) nameTextEl.textContent = nom;

  const rangEl = slot.querySelector('.fav-rank');
  const rangStr = r.rangFavori ? rangFavori(r.rangFavori) : '';
  if(rangEl.textContent !== rangStr) rangEl.textContent = rangStr;

  // La cote actuelle reste live : elle peut continuer a flasher vert/rouge,
  // c'est une info secondaire, elle ne change pas le classement ni le Δ record.
  const coteEl = slot.querySelector('.cote');
  if(coteEl.textContent !== coteGStr){
    coteEl.textContent = coteGStr;
    const prevC = lastGagnant[num];
    if(!changedHorse && prevC !== undefined && coteG !== undefined && coteG !== prevC){
      slot.classList.remove('flash-up','flash-down');
      void slot.offsetWidth;
      slot.classList.add(coteG < prevC ? 'flash-up' : 'flash-down');
      clearTimeout(slot._flashTimer);
      slot._flashTimer = setTimeout(()=>slot.classList.remove('flash-up','flash-down'), 500);
    }
  }
  if(coteG !== undefined) lastGagnant[num] = coteG;

  // Δ record : figé, ne bouge que si un nouveau record est detecte pour ce cheval
  const deltaEl = slot.querySelector('.var');
  if(deltaEl.textContent !== deltaRecordStr) deltaEl.textContent = deltaRecordStr;
  deltaEl.classList.remove('up','down','flat');
  deltaEl.classList.add(deltaRecord !== undefined ? 'up' : 'flat');
  deltaEl.title = `Plus gros écart de cote détecté pendant la dernière minute avant le départ (figé, critère de classement)`;

  // Vitesse record : figee elle aussi (vitesse au moment ou le record a ete detecte)
  const vitesseEl = slot.querySelector('.vitesse');
  if(vitesseEl.textContent !== speedRecordStr) vitesseEl.textContent = speedRecordStr;
  vitesseEl.classList.remove('up','down','flat');
  if(speedRecord === undefined) vitesseEl.classList.add('flat');
  else if(speedRecord > 0) vitesseEl.classList.add('up');
  else if(speedRecord < 0) vitesseEl.classList.add('down');
  else vitesseEl.classList.add('flat');
  vitesseEl.title = `Vitesse enregistrée au moment du plus gros écart détecté (figée, ne change plus jusqu'au prochain record)`;

  // Petit indicateur "figé il y a Xs", recalcule a chaque cycle a partir du
  // timestamp du record — seul CE texte bouge en continu, jamais le chiffre.
  const ageEl = slot.querySelector('.record-age');
  const recordAt = (r.recordAt === null || r.recordAt === undefined) ? undefined : r.recordAt;
  if(recordAt !== undefined){
    slot.dataset.recordAt = String(recordAt);
  } else {
    delete slot.dataset.recordAt;
  }
  if(ageEl){
    ageEl.textContent = recordAt !== undefined ? fmtAge((Date.now()/1000) - recordAt) : '';
  }

  // Si le cheval de cet emplacement a change (un autre a pris sa place dans
  // le classement), petit fondu du contenu pour signaler le changement sans
  // deplacer physiquement l'emplacement a l'ecran.
  if(changedHorse){
    const body = slot.querySelector('.slot-body');
    body.classList.add('swap');
    requestAnimationFrame(()=>{ body.classList.remove('swap'); });
  }
}

function renderBoard(rows){
  ensureSlots();

  const list = (rows || []);

  // Rang au favoritisme : classement de tous les partants par cote
  // (probabilité implicite) décroissante, utilisé uniquement pour l'info
  // "1er favori / 2e favori..." affichée sous le nom.
  const rangParNum = {};
  list
    .filter(r => r.coteG !== null && r.coteG !== undefined)
    .sort((a, b) => b.coteG - a.coteG)
    .forEach((r, i) => { rangParNum[r.num] = i + 1; });

  // Le serveur renvoie deja "rows" trie par classement (plus forte
  // progression de part de marche) avec un flag "hidden" pour les tocards
  // et le surplus au-dela de son propre top interne. On prend simplement
  // les 5 premieres lignes NON masquees : ce sont "les 5 valeurs les plus
  // hautes" du classement genere en arriere-plan.
  const top5 = list
    .filter(r => !r.hidden)
    .slice(0, TOP_N)
    .map(r => ({ ...r, rangFavori: rangParNum[r.num] }));

  for(let i = 0; i < TOP_N; i++){
    const slot = slotEls[i];
    const r = top5[i];
    if(!r){
      setSlotEmpty(slot);
    } else {
      fillSlot(slot, r);
    }
  }
}

function applyState(data){
  courseInfoEl.textContent = data.courseInfo || 'Chargement…';
  departTs = data.departTs;
  toteLabelEl.textContent = data.toteLabel || '';

  if(data.snapLine){
    snapLineEl.textContent = data.snapLine;
  }
  snapLineEl.style.display = 'none';

  if(data.statusLine){
    statusLineEl.textContent = data.statusLine;
    statusLineEl.style.color = data.statusLine.startsWith('Erreur') ? 'var(--danger)' : 'var(--text-dim)';
  } else {
    statusLineEl.textContent = '';
  }

  renderBoard(data.rows);
}

async function pollState(){
  const controller = new AbortController();
  const killer = setTimeout(()=>controller.abort(), FETCH_TIMEOUT_MS);
  try{
    const res = await fetch('/api/state', { signal: controller.signal, cache: "no-store" });
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    applyState(data);
  }catch(e){
    if(e.name !== "AbortError"){
      statusLineEl.textContent = `Connexion au serveur perdue, nouvelle tentative… (${e.message})`;
      statusLineEl.style.color = "var(--danger)";
    }
  }finally{
    clearTimeout(killer);
    setTimeout(pollState, POLL_INTERVAL_MS);
  }
}

setInterval(tickCountdown, 500);
pollState();
</script>
</body>
</html>
